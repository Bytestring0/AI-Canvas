}


/* ===== 80-anim.js ===== */
/* =============================================================================
 * 80-anim.js — the living parts: rain, splashes, puddle ripples, eave drips,
 * water sliding down the glass, oden steam, the automatic door, the signals.
 * ========================================================================== */

const RAIN = [];
const SPLASH = [];
const RIPPLE = [];
const DROP = [];
const WISP = [];

function inStore(x, z) {
  return x > S.x0 - 0.1 && x < S.x1 + 0.35 && z > S.z0 - 0.1 && z < S.z1 + 0.35;
}
function groundY(x, z) {
  if (x > L.roadE[0] || z > L.roadS[0]) return YROAD;
  if (x > S.x1 + 0.06 && z > S.z1 + 0.06) return YAPRON;
  return YWALK;
}
/** what the rain hits first from above: a roof, a canopy, or the street */
function landingY(x, z) {
  if (x > L.nb.x0 && x < L.nb.x1 && z > L.nb.z0 && z < L.nb.z1) return L.nb.h + 0.2;
  if (inStore(x, z)) return S.h + 0.24;
  const g = groundY(x, z);
  // the two canopies throw a small eave line beyond the walls
  if (x > S.x0 && x < S.x1 + 0.12 && z > S.z1 && z < S.z1 + 0.84) return Math.min(g, 2.72);
  if (z > S.z0 && z < S.z1 && x > S.x1 && x < S.x1 + 0.84) return Math.min(g, 2.72);
  return g;
}

function rainCount() {
  if (T.reduced) return 70;
  return T.quality >= 2 ? 440 : T.quality === 1 ? 260 : 140;
}
function mkDrop(fresh) {
  const m = HALF + 1.6;
  return {
    x: rr(-m, m), y: fresh ? rr(0.2, 8.6) : rr(6.4, 9.4), z: rr(-m, m),
    spd: rr(7.4, 11.4), l: rr(0.24, 0.66), a: rr(0.2, 0.5), w: rr(0.8, 1.7),
  };
}
function initSims() {
  RAIN.length = 0; SPLASH.length = 0; RIPPLE.length = 0; DROP.length = 0; WISP.length = 0;
  const n = rainCount();
  for (let i = 0; i < n; i++) RAIN.push(mkDrop(true));
  for (const p of PANES) {                       // droplets riding the glass
    const k = Math.max(3, Math.min(9, Math.round(p.w * p.h * 1.5)));
    for (let i = 0; i < k; i++) {
      p.drops.push({
        u: rr(0.06, 0.94), v: rr(0.08, 1.0), r: rr(0.013, 0.032),
        s: rr(0.03, 0.12), rest: rr(0, 1.8), tail: rr(0.05, 0.16),
      });
    }
  }
  for (const s of STEAM) {
    for (let i = 0; i < s.n; i++) WISP.push({ s: s, t: rr(0, 1), sp: rr(0.22, 0.42), ph: rr(0, TAU), r: rr(0.06, 0.13) });
  }
  for (const d of DRIP) d.acc = rr(0, 1 / d.rate);
}

function stepRain(dt) {
  if (T.reduced) return;
  const slx = -0.16, slz = 0.10;                  // the wind slant, m/s
  for (let i = 0; i < RAIN.length; i++) {
    const d = RAIN[i];
    d.y -= d.spd * dt;
    d.x += slx * dt; d.z += slz * dt;
    const land = landingY(d.x, d.z);
    if (d.y <= land) {
      if (SPLASH.length < 44 && land < 4.2) {
        SPLASH.push({ x: d.x, y: land, z: d.z, t: 0, life: rr(0.24, 0.4), r: rr(0.06, 0.15) });
      }
      RAIN[i] = mkDrop(false);
    }
  }
  for (let i = SPLASH.length - 1; i >= 0; i--) {
    SPLASH[i].t += dt;
    if (SPLASH[i].t > SPLASH[i].life) SPLASH.splice(i, 1);
  }
  if (PUDDLES.length && rnd() < dt * 6.5 && RIPPLE.length < 26) {
    const p = PUDDLES[ri(0, PUDDLES.length - 1)];
    const a = rnd() * TAU, q = Math.sqrt(rnd()) * p.r * 0.76;
    RIPPLE.push({
      x: p.x + Math.cos(a) * q, y: p.y + 0.004, z: p.z + Math.sin(a) * q * 0.7,
      t: 0, life: rr(0.85, 1.7), r: rr(0.12, 0.3), w: rr(1.5, 3.2),
    });
  }
  for (let i = RIPPLE.length - 1; i >= 0; i--) {
    RIPPLE[i].t += dt;
    if (RIPPLE[i].t > RIPPLE[i].life) RIPPLE.splice(i, 1);
  }
  for (const e of DRIP) {                          // beads gathering at the eaves
    e.acc += dt * e.rate * 0.5;
    while (e.acc > 1) {
      e.acc -= 1;
      if (DROP.length < 58) DROP.push({ x: e.x + rr(-0.04, 0.04), y: e.y, y0: e.y, z: e.z + rr(-0.03, 0.03), vy: 0.15, vx: -0.1 });
    }
  }
  for (let i = DROP.length - 1; i >= 0; i--) {
    const d = DROP[i];
    d.vy += 12 * dt; d.y -= d.vy * dt; d.x += d.vx * dt;
    const land = landingY(d.x, d.z);
    if (d.y <= land) {
      if (SPLASH.length < 44) SPLASH.push({ x: d.x, y: land, z: d.z, t: 0, life: 0.4, r: 0.19 });
      DROP.splice(i, 1);
    }
  }
  for (const p of PANES) {
    for (const dr of p.drops) {
      if (dr.rest > 0) { dr.rest -= dt; continue; }
      dr.v -= dr.s * dt * (0.35 + dr.r * 14);
      if (dr.v < -0.03) {
        dr.v = 1.02; dr.u = rr(0.06, 0.94); dr.r = rr(0.013, 0.032); dr.rest = rr(0.3, 2.2);
      }
    }
  }
  for (const w of WISP) {
    w.t += dt * w.sp;
    if (w.t > 1) { w.t -= 1; w.ph = rr(0, TAU); w.r = rr(0.06, 0.13); }
  }
}

/* ---------- drawing the weather ---------- */
const _q1 = { x: 0, y: 0, z: 0, ok: false }, _q2 = { x: 0, y: 0, z: 0, ok: false };

function drawRain() {
  ctx.lineCap = 'round';
  const sl = T.reduced ? 0.3 : 0.055;
  for (let i = 0; i < RAIN.length; i++) {
    const d = RAIN[i];
    const a = proj([d.x, d.y, d.z], _q1);
    if (!a.ok) continue;
    if (a.x < -20 || a.x > VW + 20 || a.y < -20 || a.y > VH + 20) continue;
    const b = proj([d.x + sl * d.l, d.y - d.l, d.z - sl * d.l * 0.6], _q2);
    if (!b.ok) continue;
    const fade = clamp(1.3 - a.z / 28, 0.22, 1);
    ctx.globalAlpha = d.a * fade;
    ctx.strokeStyle = a.z < 7 ? '#e2f1ff' : '#9fc6ea';
    ctx.lineWidth = Math.max(0.5, d.w * (VH / 720) * clamp(1.7 / a.z, 0.32, 1.5));
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawSplashes() {
  for (let i = 0; i < SPLASH.length; i++) {
    const s = SPLASH[i];
    const k = s.t / s.life;
    const r = s.r * (0.25 + k * 1.5);
    const a = proj([s.x, s.y, s.z], _q1);
    if (!a.ok) continue;
    const rr0 = Math.max(0.8, screenR(r, a.z));
    ctx.globalAlpha = (1 - k) * 0.38;
    ctx.strokeStyle = '#d2e8ff';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(a.x, a.y, rr0, rr0 * 0.42, 0, 0, TAU); ctx.stroke();
    if (k < 0.42) {
      const h = screenR(0.085 * (1 - k * 2.3), a.z);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x, a.y - h); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawRippleRings() {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < RIPPLE.length; i++) {
    const r = RIPPLE[i];
    const k = r.t / r.life;
    const rad = r.r * (0.1 + k * 1.5);
    const a = proj([r.x, r.y, r.z], _q1);
    if (!a.ok) continue;
    const rx = Math.max(0.8, screenR(rad, a.z));
    ctx.globalAlpha = (1 - k) * (1 - k) * 0.45;
    ctx.strokeStyle = '#c3e6ff';
    ctx.lineWidth = Math.max(0.5, r.w * (VH / 900));
    ctx.beginPath(); ctx.ellipse(a.x, a.y, rx, rx * 0.46, 0, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawDrips() {
  ctx.lineCap = 'round';
  for (let i = 0; i < DROP.length; i++) {
    const d = DROP[i];
    const a = proj([d.x, d.y, d.z], _q1);
    if (!a.ok) continue;
    const b = proj([d.x, d.y + Math.min(0.42, 0.06 + d.vy * 0.05), d.z], _q2);
    if (!b.ok) continue;
    ctx.globalAlpha = 0.42;
    ctx.strokeStyle = '#cfe8ff';
    ctx.lineWidth = Math.max(0.55, screenR(0.017, a.z));
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // the bead only hangs where it is still clinging to the eave
    if (d.y0 - d.y < 0.22) {
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#eaf6ff';
      ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(0.7, screenR(0.02, a.z)), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawDroplets() {
  ctx.globalCompositeOperation = 'lighter';
  for (let pi = 0; pi < PANES.length; pi++) {
    const p = PANES[pi];
    for (let i = 0; i < p.drops.length; i++) {
      const dr = p.drops[i];
      const hv = clamp(dr.v, 0, 1);
      const wx = p.o[0] + p.ex[0] * dr.u + p.ey[0] * hv;
      const wy = p.o[1] + p.ey[1] * hv;
      const wz = p.o[2] + p.ex[2] * dr.u + p.ey[2] * hv;
      const q = proj([wx, wy, wz], _q1);
      if (!q.ok) continue;
      const r = Math.max(0.9, screenR(dr.r, q.z) * 1.7);
      const gr = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * 2.1);
      gr.addColorStop(0, 'rgba(228,247,255,0.3)');
      gr.addColorStop(0.42, 'rgba(176,222,255,0.11)');
      gr.addColorStop(1, 'rgba(120,180,230,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(q.x, q.y, r * 2.1, 0, TAU); ctx.fill();
      if (dr.tail > 0.001) {
        const q2 = proj([wx, wy + dr.tail * p.h * 0.55, wz], _q2);
        if (q2.ok) {
          ctx.strokeStyle = 'rgba(214,240,255,0.17)';
          ctx.lineWidth = Math.max(0.6, r * 0.7);
          ctx.beginPath(); ctx.moveTo(q2.x, q2.y); ctx.lineTo(q.x, q.y - r * 0.35); ctx.stroke();
        }
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawSteam() {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < WISP.length; i++) {
    const w = WISP[i], s = w.s, k = w.t;
    const x = s.x + Math.sin(w.ph + k * 3.4) * 0.14 * k + (T.reduced ? 0 : Math.sin(T.t * 0.7 + w.ph) * 0.035);
    const z = s.z + Math.cos(w.ph * 1.3 + k * 2.6) * 0.1 * k;
    const y = s.y + k * 0.82;
    const q = proj([x, y, z], _q1);
    if (!q.ok) continue;
    const r = screenR(w.r + k * 0.19, q.z);
    const a = (1 - k) * k * 2.1 * 0.3;
    if (a <= 0.004 || r < 1) continue;
    const gr = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
    gr.addColorStop(0, 'rgba(255,239,216,' + a.toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,228,196,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- the automatic door, opening for nobody ---------- */
function stepDoor(dt) {
  if (T.reduced) { DOOR.open = 0; return; }
  DOOR.timer -= dt;
  if (DOOR.timer <= 0) {
    DOOR.want = DOOR.want > 0.5 ? 0 : 1;
    DOOR.timer = DOOR.want ? 2.3 : rr(4.5, 10.5);
  }
  const k = 1 - Math.exp(-dt * 4.4);
  DOOR.open += (DOOR.want - DOOR.open) * k;
  if (Math.abs(DOOR.want - DOOR.open) < 0.004) DOOR.open = DOOR.want;
}

/* ---------- traffic lights ---------- */
function sigVal(kind, phase) {
  if (T.reduced) {
    if (kind === 'green') return 1;
    if (kind === 'ped') return 0.14;
    return 0.05;
  }
  const p = ((T.t / 17) + phase) % 1;
  if (kind === 'ped') {
    const walk = p > 0.52;
    if (!walk) return 0.12;
    const blink = p > 0.88 ? (Math.sin(T.t * 8.4) > 0 ? 0.3 : 1) : 1;
    return 0.95 * blink;
  }
  if (kind === 'green') return p <= 0.42 ? 1 : 0.05;
  if (kind === 'amber') return (p > 0.42 && p <= 0.5) || p > 0.94 ? 1 : 0.05;
  return p > 0.5 ? 1 : 0.05;
}
const DARKLENS = col('#39414a');
function stepSignals() {
  for (let i = 0; i < SIGNALS.length; i++) {
    const s = SIGNALS[i];
    const v = sigVal(s.key, s.phase);
    s.v = v;
    s.f.em = v > 0.5 ? 0.98 : 0;
    s.f.c = v > 0.5 ? col(s.hex) : DARKLENS;
  }
}

/* ---------- master step ---------- */
function stepSims(dt) {
  stepRain(dt);
  stepDoor(dt);
  stepSignals();
  for (let i = 0; i < ANIMS.length; i++) {
    const f = ANIMS[i];
    if (f.anim) f.anim(f, T.t, dt);
  }
}

/* ---------- idle auto-orbit, paused the moment you touch anything ---------- */
function stepAutoOrbit(dt) {
  if (T.reduced || !T.autoOrbit) return;
  T.idle += dt;
  if (T.idle > 6) CAM.want.yaw += dt * 0.035;
}


/* ===== 90-boot.js ===== */
/* =============================================================================
 * 90-boot.js — input (pointer orbit / pan / pinch / keyboard), capability
 * detection, adaptive quality, and the frame loop. No interface chrome at all:
 * the whole page is the model.
 * ========================================================================== */

const ptrs = new Map();
let pinchD = 0, lastMid = null, dragging = false;

function markActive() { T.idle = 0; }
function clampCam() {
  const w = CAM.want, CL = CAM_LIMITS;
  w.yaw = w.yaw;                                        // free spin
  w.pitch = clamp(w.pitch, CL.pitch[0], CL.pitch[1]);
  w.dist = clamp(w.dist, CL.dist[0], CL.dist[1]);
  w.tx = clamp(w.tx, CL.tx[0], CL.tx[1]);
  w.ty = clamp(w.ty, CL.ty[0], CL.ty[1]);
  w.tz = clamp(w.tz, CL.tz[0], CL.tz[1]);
}
const panScale = () => (2 * Math.tan(CAM.fov / 2) * CAM.cur.dist) / VH;

function orbit(dx, dy) {
  CAM.want.yaw -= dx * 0.0052;
  CAM.want.pitch += dy * 0.0042;
  clampCam(); markActive();
}
function panBy(dx, dy) {
  const k = panScale();
  // horizontal drag slides along the camera's right axis, vertical drag lifts
  // or drops the pivot — the model stays upright instead of tumbling.
  T.touched = true;
  CAM.want.tx -= dx * RX * k;
  CAM.want.tz -= dx * RZ * k;
  CAM.want.ty += dy * k * 0.8;
  clampCam(); markActive();
}
function zoomBy(f) {
  T.touched = true;
  CAM.want.dist = clamp(CAM.want.dist * f, CAM_LIMITS.dist[0], CAM_LIMITS.dist[1]);
  markActive();
}
/** jump to one of the curated viewpoints, scaled to the current viewport */
function applyView(i) {
  const v = VIEWS[i] || VIEWS[0];
  T.viewMul = v.mul;
  T.touched = false;
  CAM.want.yaw = v.yaw; CAM.want.pitch = v.pitch;
  CAM.want.tx = v.tx; CAM.want.ty = v.ty; CAM.want.tz = v.tz;
  CAM.want.dist = clamp(CAM.fit * v.mul, CAM_LIMITS.dist[0], CAM_LIMITS.dist[1]);
  clampCam(); markActive();
}

function bindInput() {
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not capturable, still fine */ }
    ptrs.set(e.pointerId, {
      x: e.clientX, y: e.clientY,
      mode: (e.button === 2 || e.shiftKey || e.ctrlKey || e.metaKey) ? 'pan' : 'orbit',
    });
    dragging = true;
    canvas.classList.add('is-grabbing');
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      lastMid = [(a.x + b.x) / 2, (a.y + b.y) / 2];
    }
    markActive();
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mid = [(a.x + b.x) / 2, (a.y + b.y) / 2];
      zoomBy(pinchD / d);
      if (lastMid) panBy(mid[0] - lastMid[0], mid[1] - lastMid[1]);
      pinchD = d; lastMid = mid;
      return;
    }
    if (p.mode === 'pan') panBy(dx, dy); else orbit(dx, dy);
  });

  const end = (e) => {
    if (ptrs.delete(e.pointerId) && ptrs.size < 2) lastMid = null;
    if (ptrs.size === 0) { dragging = false; canvas.classList.remove('is-grabbing'); }
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('lostpointercapture', end);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? VH : 1;
    if (e.shiftKey) { panBy(e.deltaX * unit * 0.6, e.deltaY * unit * 0.6); return; }
    zoomBy(Math.exp(clamp(e.deltaY * unit, -260, 260) * 0.0013));
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.altKey) return;
    const step = e.shiftKey ? 2.6 : 1;
    const k = panScale() * 26 * step;
    let used = true;
    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A': CAM.want.yaw -= 0.09 * step; break;
      case 'ArrowRight': case 'd': case 'D': CAM.want.yaw += 0.09 * step; break;
      case 'ArrowUp': case 'w': case 'W': CAM.want.pitch -= 0.05 * step; break;
      case 'ArrowDown': case 's': case 'S': CAM.want.pitch += 0.05 * step; break;
      case '+': case '=': CAM.want.dist *= Math.pow(0.88, step); break;
      case '-': case '_': CAM.want.dist *= Math.pow(1.14, step); break;
      case 'q': CAM.want.tx -= RX * k; CAM.want.tz -= RZ * k; break;
      case 'e': CAM.want.tx += RX * k; CAM.want.tz += RZ * k; break;
      case 'r': case 'R': case '0': applyView(0); break;
      case '1': applyView(0); break;
      case '2': applyView(1); break;
      case '3': applyView(2); break;
      case 'c': case 'C': T.autoOrbit = !T.autoOrbit; T.idle = 0; break;
      default: used = false;
    }
    if (used) { e.preventDefault(); clampCam(); markActive(); }
  });

  window.addEventListener('resize', () => { resize(); markActive(); });
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  document.addEventListener('gesturestart', (e) => e.preventDefault());
}

/* ---------- capabilities & adaptive quality ---------- */
function detectCaps() {
  const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  T.reduced = !!(mq && mq.matches);
  if (mq && mq.addEventListener) mq.addEventListener('change', (e) => {
    T.reduced = e.matches;
    if (T.reduced) { RAIN.length = 0; SPLASH.length = 0; RIPPLE.length = 0; DROP.length = 0; }
    initSims();
  });
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const small = Math.min(window.innerWidth, window.innerHeight) < 520;
  const cores = navigator.hardwareConcurrency || 4;
  T.quality = coarse || small || cores <= 4 ? 1 : 2;
}

let _qCool = 0, _qUp = 0;
function adapt(ms) {
  T.ms = T.ms * 0.9 + ms * 0.1;
  _qCool -= 1;
  if (_qCool > 0) return;
  if (T.ms > 20.5 && T.quality > 0) {
    T.quality--; _qCool = 180; _qUp = 0;
    resize(); initSims();
  } else if (T.ms < 10.5 && T.quality < 2 && _qUp < 1) {
    T.quality++; _qCool = 240; _qUp++;
    resize(); initSims();
  }
}

/* ---------- boot ---------- */
function buildScene() {
  buildBase();
  wetGround();
  buildStore();
  buildInterior();
  buildProps();
}

let _last = 0, _acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!T.running) return;
  const t0 = now * 0.001;
  let dt = _last ? t0 - _last : 1 / 60;
  _last = t0;
  if (dt > 0.05) dt = 0.05;
  T.dt = dt; T.t += dt;
  const s = performance.now();
  stepAutoOrbit(dt);
  stepCam(dt);
  stepSims(dt);
  renderFrame(dt);
  adapt(performance.now() - s);
}

function boot() {
  detectCaps();
  resize();
  buildScene();
  initBokeh();
  initSims();
  assembleDraw();
  bindInput();
  T.running = !document.hidden;
  try { canvas.focus(); } catch (e) { /* focus is a nicety */ }
  document.addEventListener('visibilitychange', () => {
    T.running = !document.hidden;
    if (T.running) { _last = 0; }
  });
  requestAnimationFrame(frame);
}

try {
  boot();
} catch (err) {
  // the canvas is the only surface we own: report on it rather than in chrome
  console.error('diorama failed to start', err);
  window.__BOOT_ERROR__ = String(err && err.stack || err);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

/* a tiny inspection hook — no on-screen interface, just reachable from the
   console or an automated check: counts, camera state and the rebuild entry. */
window.__DIORAMA__ = {
  version: VERSION,
  get counts() {
    return {
      faces: FACES.length, lines: LINES.length, glows: GLOWS.length, lights: LIGHTS.length,
      panes: PANES.length, anims: ANIMS.length, puddles: PUDDLES.length,
      draw: DRAW.length, visible: VIS.length, rain: RAIN.length, quality: T.quality,
      reduced: T.reduced, ms: Math.round(T.ms * 10) / 10,
    };
  },
  camera: CAM, views: VIEWS, state: T, signals: SIGNALS, faces: FACES, resize: resize, rebuild: () => {
    FACES.length = 0; LINES.length = 0; GLOWS.length = 0; LIGHTS.length = 0;
    PANES.length = 0; ANIMS.length = 0; SIMS.length = 0; PUDDLES.length = 0; STEAM.length = 0; DRIP.length = 0;
    _seed = 20261017;
    buildScene(); initSims(); assembleDraw(); resize();
  },
};
</script>
</body>
