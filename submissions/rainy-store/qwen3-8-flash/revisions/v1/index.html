<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="description" content="Rainy-night Japanese convenience-store street corner rendered as a hand-orbiting miniature 3D diorama. Cel-shaded, single self-contained HTML file, no external resources.">
<title>雨夜の街角 ｜ Rainy-Night Konbini Diorama</title>
<style>/* Rainy-night konbini diorama — page shell.
 * Deliberately chrome-free: a single full-bleed canvas, no overlays, no text. */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* Deep wet-night backdrop; the canvas repaints over it, this only shows
     during the first paint or if the 2D context is unavailable. */
  background:
    radial-gradient(120% 90% at 50% 8%, #14203a 0%, #0b1224 42%, #05070f 100%),
    #05070f;
  color: #cfe0ff;
  font: 400 16px/1.7 "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Microsoft YaHei",
        "PingFang SC", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

#stage {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;              /* we implement orbit/pinch ourselves */
  -webkit-user-select: none;
  user-select: none;
  cursor: grab;
  outline: none;
  /* the model should feel like it floats on a dark table */
  background: transparent;
}

#stage.is-grabbing { cursor: grabbing; }

/* Keyboard focus is visible but quiet: no frame, just a soft inner glow that
   does not read as interface chrome. */
#stage:focus-visible {
  box-shadow: inset 0 0 0 2px rgba(150, 205, 255, .35);
}

/* Screen-reader only description; never painted. */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  #stage { cursor: crosshair; }
}</style>
</head>
<body>
<canvas id="stage" tabindex="0" role="img" aria-label="Microscopic three-dimensional model of a Japanese convenience store on a street corner in the rain at night. Drag to orbit, scroll or pinch to zoom, shift-drag to pan, arrow keys and W A S D to move the view."></canvas>
<script>/* Built 2026-10-17 from 11 modules: 10-core.js, 20-geom.js, 30-render.js, 35-frame.js, 40-tex.js, 44-scene-base.js, 50-scene-store.js, 60-scene-interior.js, 70-scene-props.js, 80-anim.js, 90-boot.js */

/* ===== 10-core.js ===== */
'use strict';
/* =============================================================================
 * 10-core.js — constants, small vector math, camera rig, global state.
 *
 * Everything below runs in one concatenated top-level scope (see build.mjs).
 * Units: metres, y-up, ground surface of the diorama plinth at y = 0.
 * ========================================================================== */

const VERSION = '1.0.0';
const MOBILE_BP = 560;
const TAU = Math.PI * 2;

/* ---- scene bounds (the collectible base plate) ---- */
const HALF = 7.0;          // plinth spans -HALF .. +HALF in x and z
const PLINTH_T = 1.45;     // thickness of the base block

/* ---- street / plot layout ---- */
const L = {
  /* south street runs along x, east street runs along z */
  roadS: [4.15, HALF],     // z band of the south road
  roadE: [4.15, HALF],     // x band of the east road
  walkS: [2.68, 4.15],     // sidewalk band along the south road
  walkE: [2.68, 4.15],     // sidewalk band along the east road
  /* store footprint: glazed to the south (+z) and to the east (+x) */
  store: { x0: -3.25, x1: 2.68, z0: -3.62, z1: 2.68, h: 3.30 },
  /* alley between store and neighbour block */
  alley: { x0: -5.00, x1: -3.25, z0: -HALF, z1: 2.68 },
  nb: { x0: -HALF, x1: -5.00, z0: -1.05, z1: 2.68, h: 5.3 },  // neighbour building
  lot: { x0: -HALF, x1: -5.00, z0: -HALF, z1: -1.05 },        // back yard / parking pad
};
L.curb = 0.15;                       // curb height
L.apronY = 0.02;                     // tiled apron in front of the door sits slightly high

/* ---- palette ---- */
const P = {
  ink: '#0a0f1a',
  inkSoft: '#161d2b',
  asphalt: '#1b2130',
  asphaltWet: '#141a26',
  concrete: '#3f4757',
  walk: '#4a5262',
  walkWarm: '#57606f',
  curb: '#7c8698',
  tile: '#8d96a5',
  paint: '#d8dee9',
  paintY: '#e8d78c',
  storeWall: '#c9d3df',
  storeWallShade: '#9fb0c4',
  storeBand: '#1d4f3f',
  storeBand2: '#e86a3c',
  glass: '#b9e4ff',
  roof: '#2c3444',
  metal: '#6f7a8c',
  metalDark: '#3b4252',
  inner: '#e9eef5',
  innerWarm: '#f2e3c8',
  shelf: '#dfe6ee',
  neonMint: '#54e0b6',
  neonBlue: '#57b6ff',
  neonWarm: '#ffd39a',
  neonPink: '#ff9ec4',
  sodium: '#ffbe63',
  led: '#eaf3ff',
};

/* ---- colour helpers ---- */
function C(hex) {                                    // '#rgb' | '#rrggbb' -> [r,g,b] 0..255
  let h = hex[0] === '#' ? hex.slice(1) : hex;
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const CC = {};                                        // memoised hex -> rgb
function col(hex) { return CC[hex] || (CC[hex] = C(hex)); }

/* ---- vector math (plain arrays; hot loops use inlined dot products) ---- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul3 = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function cross3(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function norm3(a) {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (t) => t * t * (3 - 2 * t);

/* deterministic pseudo-random so every reload looks identical */
let _seed = 20261017;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = (arr) => arr[ri(0, arr.length - 1)];

/* ---- global mutable scene collections ---- */
const FACES = [];   // shaded polygons (opaque + alpha, one depth-sorted pass)
const LINES = [];   // world-space polylines (wires, bike wheels, rails)
const GLOWS = [];   // additive halos / wet-street pools & smears
const PANES = [];   // glass panes used as anchors for sliding droplets
const LIGHTS = [];  // coloured point lights used for the per-face neon tint
const ANIMS = [];   // faces whose geometry / appearance changes per frame
const SIMS = [];    // animation drivers (door, signal, flicker, steam, rain…)
const VIS = [];     // per-frame visible subset of the draw list
const TEX = {};     // procedural texture cache, populated by 40-tex.js

/* ---- time & capability state ---- */
const T = {
  t: 0,                  // seconds of scene time
  wall: 0,
  dt: 1 / 60,
  reduced: false,        // prefers-reduced-motion
  quality: 2,            // 2 high · 1 medium · 0 lean
  ms: 16,                // rolling frame cost
  autoOrbit: true,
  idle: 0,               // seconds since last user input
  running: true,         // paused while the tab is hidden
  touched: false,        // the viewer has chosen their own framing
  viewMul: 1,            // which VIEWS entry the fit distance is scaled by
};

/* ---- camera rig: orbit around a pannable target ---- */
const CAM = {
  yaw: 0.62, pitch: 0.29, dist: 15.8,
  want: { yaw: 0.62, pitch: 0.29, dist: 15.8, tx: 0.20, ty: 1.28, tz: 0.35 },
  cur: { yaw: 0.62, pitch: 0.29, dist: 15.8, tx: 0.20, ty: 1.28, tz: 0.35 },
  fov: 30 * Math.PI / 180,
  near: 0.30,
  eye: [0, 0, 0], f: [0, 0, 1], r: [1, 0, 0], u: [0, 1, 0],
  focal: 800, cx: 0, cy: 0, W: 0, H: 0, dpr: 1,
  fit: 19.5,               // distance at which the whole plate just fits
};
const CAM_HOME = JSON.parse(JSON.stringify(CAM.want));
const CAM_LIMITS = {
  dist: [8.2, 44],
  pitch: [0.10, 1.06],
  tx: [-4.5, 5.0], ty: [0.35, 3.4], tz: [-4.5, 5.0],
};

/* three curated viewpoints for the keyboard (1 / 2 / 3) */
/* Distances are multiples of the auto-fit distance, so the whole plate stays in
 * frame whatever the viewport shape. */
const VIEWS = [
  { yaw: 0.62, pitch: 0.29, mul: 1.00, tx: 0.20, ty: 1.28, tz: 0.35 },    // corner 3/4
  { yaw: 0.90, pitch: 0.11, mul: 0.78, tx: 0.95, ty: 1.34, tz: 1.85 },    // eye-level at the doors
  { yaw: -0.55, pitch: 0.80, mul: 1.30, tx: -0.4, ty: 0.95, tz: -0.2 },   // high over the roof & alley
];

/* ---- the single hot light direction for the toon ramp (cold moon + sky) ---- */
const KEY = norm3([-0.42, 0.86, -0.30]);
const SKY = [0.52, 0.63, 0.92];      // ambient tint, cool
const GND = [0.44, 0.42, 0.50];      // bounce from the wet street
const WARM = [1.0, 0.80, 0.55];      // interior spill tint


/* ===== 20-geom.js ===== */
/* =============================================================================
 * 20-geom.js — authoring primitives. Every call appends polygons / polylines /
 * lights to the shared collections declared in 10-core.js.
 *
 * Texture mapping is resolved once, at build time, into per-vertex uvs:
 *   o.uv    = [u0,v0,u1,v1]  explicit (posters, sign faces)
 *   o.tsize = [sx, sz]       world-projected tiling (road, tiles, panels)
 *   o.tileN = 'x'|'y'|'z'    force the projection plane for tsize
 * ========================================================================== */

const DEFAULT_UV = [[0, 0], [1, 0], [1, 1], [0, 1]];

function faceUV(verts, n, nm, o) {
  const uv = new Float32Array(n * 2);
  if (n === 4 && o.uv) {
    // verts arrive as bottom-left, bottom-right, top-right, top-left; q is given
    // in image space (v = 0 at the top of the texture), so flip v here.
    const q = o.uv;
    uv[0] = q[0]; uv[1] = 1 - q[1];
    uv[2] = q[2]; uv[3] = 1 - q[1];
    uv[4] = q[2]; uv[5] = 1 - q[3];
    uv[6] = q[0]; uv[7] = 1 - q[3];
    return uv;
  }
  if (o.tsize) {
    const ax = o.tileN || (Math.abs(nm[1]) > 0.7 ? 'y' : (Math.abs(nm[0]) > 0.7 ? 'x' : 'z'));
    const s = o.tsize[0] || 1, t = o.tsize[1] || s;
    for (let i = 0; i < n; i++) {
      const v = verts[i];
      if (ax === 'y') { uv[i * 2] = v[0] / s; uv[i * 2 + 1] = v[2] / t; }
      else if (ax === 'x') { uv[i * 2] = v[2] / s; uv[i * 2 + 1] = -v[1] / t; }
      else { uv[i * 2] = v[0] / s; uv[i * 2 + 1] = -v[1] / t; }
    }
    return uv;
  }
  if (n !== 4) return null;
  for (let i = 0; i < 4; i++) { uv[i * 2] = DEFAULT_UV[i][0]; uv[i * 2 + 1] = DEFAULT_UV[i][1]; }
  return uv;
}

/** Generic polygon face. verts: array of [x,y,z] (3..8), ordered so that
 *  cross(v1-v0, vlast-v0) points at the side the face should be visible from. */
/** while the shop interior is being built this is 'inside', so every surface
 *  created in that pass inherits the warm interior light unless it says otherwise */
let FORCE_LIT = null;

function face(verts, o) {
  o = o || {};
  const n = verts.length;
  let ctr = [0, 0, 0];
  for (let i = 0; i < n; i++) { ctr[0] += verts[i][0]; ctr[1] += verts[i][1]; ctr[2] += verts[i][2]; }
  ctr[0] /= n; ctr[1] /= n; ctr[2] /= n;
  const nm = o.n ? o.n.slice() : norm3(cross3(sub(verts[1], verts[0]), sub(verts[n - 1], verts[0])));
  let rad = 0;
  for (let i = 0; i < n; i++) rad = Math.max(rad, Math.hypot(verts[i][0] - ctr[0], verts[i][1] - ctr[1], verts[i][2] - ctr[2]));
  const f = {
    v: verts, n: nm, ctr: ctr, rad: rad,
    c: o.c ? (typeof o.c === 'string' ? col(o.c) : o.c) : [128, 128, 128],
    em: o.em || 0,
    al: o.al === undefined ? 1 : o.al,
    ink: o.ink === undefined ? 1 : o.ink,
    inkc: o.inkc ? (typeof o.inkc === 'string' ? col(o.inkc) : o.inkc) : null,
    tex: o.tex || null, texA: o.texA === undefined ? 1 : o.texA,
    tiled: o.tsize ? 1 : 0,
    uv: faceUV(verts, n, nm, o),
    cull: o.cull !== false,
    add: !!o.add,
    lit: o.lit || FORCE_LIT || 'night',
    bias: o.bias || 0,
    d: 0,
    sv: new Float32Array(n * 5),
    cp: new Float32Array((n + 8) * 5),
    sp: new Float32Array((n + 8) * 2),
    npoly: 0,
    tag: o.tag || '',
  };
  if (o.tex && typeof o.tex === 'object' && o.tex.__tex) f.tex = o.tex;
  FACES.push(f);
  if (o.anim) ANIMS.push(f);
  return f;
}

/** ground quad, normal +y (sgn -1 for undersides). Long textured quads are
 *  split into <=3.2 m cells so the affine texture warp stays accurate. */
function gq(x0, z0, x1, z1, y, o) {
  o = o || {};
  const s = o.sgn === undefined ? 1 : o.sgn;
  if (o.tex && !o.nosub && (Math.abs(x1 - x0) > 6.4 || Math.abs(z1 - z0) > 6.4)) {
    const nx = Math.max(1, Math.ceil(Math.abs(x1 - x0) / 3.2));
    const nz = Math.max(1, Math.ceil(Math.abs(z1 - z0) / 3.2));
    const dx = (x1 - x0) / nx, dz = (z1 - z0) / nz;
    const oo = Object.assign({}, o, { nosub: 1, ink: 0 });
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
      const a = x0 + i * dx, b = z0 + j * dz;
      face(s > 0
        ? [[a, y, b], [a, y, b + dz], [a + dx, y, b + dz], [a + dx, y, b]]
        : [[a + dx, y, b], [a, y, b], [a, y, b + dz], [a + dx, y, b + dz]], oo);
    }
    return null;
  }
  const v = s > 0
    ? [[x0, y, z0], [x0, y, z1], [x1, y, z1], [x1, y, z0]]
    : [[x1, y, z0], [x0, y, z0], [x0, y, z1], [x1, y, z1]];
  return face(v, o);
}

/** vertical wall at z = const. sgn +1 faces +z (toward the south street). */
function wallZ(z, x0, x1, y0, y1, sgn, o) {
  o = o || {};
  const v = sgn > 0
    ? [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]
    : [[x1, y0, z], [x0, y0, z], [x0, y1, z], [x1, y1, z]];
  return face(v, o);
}

/** vertical wall at x = const. sgn +1 faces +x (toward the east street). */
function wallX(x, z0, z1, y0, y1, sgn, o) {
  o = o || {};
  const v = sgn > 0
    ? [[x, y0, z1], [x, y0, z0], [x, y1, z0], [x, y1, z1]]
    : [[x, y0, z0], [x, y0, z1], [x, y1, z1], [x, y1, z0]];
  return face(v, o);
}

/** axis-aligned box. sides keys: t b f(+z) k(-z) r(+x) l(-x) */
function boxG(x0, y0, z0, x1, y1, z1, o) {
  o = o || {};
  const S = o.sides || {};
  const mk = (k) => {
    const c = S[k] || o.c;
    const oo = Object.assign({}, o); delete oo.sides; if (c) oo.c = c; return oo;
  };
  const out = [];
  out.push(wallZ(z1, x0, x1, y0, y1, +1, mk('f')));
  out.push(wallZ(z0, x0, x1, y0, y1, -1, mk('k')));
  out.push(wallX(x1, z0, z1, y0, y1, +1, mk('r')));
  out.push(wallX(x0, z0, z1, y0, y1, -1, mk('l')));
  out.push(gq(x0, z0, x1, z1, y1, Object.assign(mk('t'), { sgn: 1 })));
  out.push(gq(x0, z0, x1, z1, y0, Object.assign(mk('b'), { sgn: -1 })));
  return out;
}

/** centred box from size — easier for props */
function boxC(cx, cy, cz, sx, sy, sz, o) {
  return boxG(cx - sx / 2, cy - sy / 2, cz - sz / 2, cx + sx / 2, cy + sy / 2, cz + sz / 2, o);
}

/** cylinder along 'x' | 'y' | 'z', with flat caps */
function cyl(cx, cy, cz, r, len, axis, segs, o) {
  o = o || {};
  axis = axis || 'y'; segs = segs || 8;
  const out = [];
  const A = axis === 'y' ? 1 : axis === 'x' ? 0 : 2;
  const B = (A + 1) % 3, D = (A + 2) % 3;
  const p0 = [cx, cy, cz], p1 = [cx, cy, cz];
  p0[A] -= len / 2; p1[A] += len / 2;
  const q = (a) => { const v = [0, 0, 0]; v[B] = Math.cos(a) * r; v[D] = Math.sin(a) * r; return v; };
  const oo = Object.assign({}, o); delete oo.caps; delete oo.capInk;
  for (let i = 0; i < segs; i++) {
    const b0 = q((i / segs) * Math.PI * 2), b1 = q(((i + 1) / segs) * Math.PI * 2);
    out.push(face([add3(p0, b0), add3(p0, b1), add3(p1, b1), add3(p1, b0)], oo));
  }
  if (o.caps !== false) {
    const ringAt = (p) => { const pts = []; for (let i = 0; i < segs; i++) pts.push(add3(p, q((i / segs) * Math.PI * 2))); return pts; };
    const ci = o.capInk === undefined ? 0.8 : o.capInk;
    out.push(face(ringAt(p1), Object.assign({}, oo, { ink: ci })));
    out.push(face(ringAt(p0).reverse(), Object.assign({}, oo, { ink: ci })));
  }
  return out;
}

/** thin flat box = "panel": axis is the normal of the big face */
function panel(cx, cy, cz, w, h, th, axis, o) {
  if (axis === 'y') return boxC(cx, cy, cz, w, th, h, o);
  if (axis === 'x') return boxC(cx, cy, cz, th, h, w, o);
  return boxC(cx, cy, cz, w, h, th, o);
}

/* ---------- polylines (wires, rails, wheels) ---------- */
function poly(points, o) {
  o = o || {};
  const L2 = {
    p: points, c: o.c ? (typeof o.c === 'string' ? col(o.c) : o.c) : [20, 24, 32],
    w: o.w === undefined ? 1.6 : o.w, al: o.al === undefined ? 1 : o.al,
    ink: o.ink === undefined ? 0 : o.ink, bias: o.bias || 0,
    d: 0, sp: new Float32Array(points.length * 2), np: 0,
    fade: o.fade || 0, add: !!o.add,
  };
  LINES.push(L2);
  return L2;
}

/** catenary between two world points (sag in metres) */
function wire(a, b, sag, segs, o) {
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    pts.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t) - sag * 4 * t * (1 - t), lerp(a[2], b[2], t)]);
  }
  return poly(pts, o);
}

/** circle polyline in a chosen plane — wheels, manholes, lids */
function ring(cx, cy, cz, r, axis, segs, o) {
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    if (axis === 'y') pts.push([cx + Math.cos(a) * r, cy, cz + Math.sin(a) * r]);
    else if (axis === 'x') pts.push([cx, cy + Math.cos(a) * r, cz + Math.sin(a) * r]);
    else pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, cz]);
  }
  return poly(pts, o);
}

/* ---------- lights / glows ---------- */
function light(p, hex, r, i, live) {
  LIGHTS.push({ p: p, c: C(hex).map((v) => v / 255), r: r, i: i, live: live || null, base: i });
  return LIGHTS[LIGHTS.length - 1];
}
function glow(p, hex, r, i, kinds, live, hi) {
  const g = {
    p: p, c: typeof hex === 'string' ? col(hex) : hex, r: r, i: i, base: i,
    kinds: kinds || 'halo', live: live || null, on: true,
    hi: hi || (/smear|pool/.test(kinds || '') ? [p[0], p[1] + Math.max(0.6, r * 1.1), p[2]] : null),
  };
  GLOWS.push(g);
  return g;
}

/* ---------- glass pane anchor (for sliding droplets) ---------- */
function pane(o, ex, ey, w, h) {
  const p = { o: o, ex: ex, ey: ey, w: w, h: h, drops: [] };
  PANES.push(p);
  return p;
}

/* ---------- animated-face helpers ---------- */
function capture(f) { f.rest = f.v.map((v) => v.slice()); return f; }
function moveBy(f, dx, dy, dz) {
  for (let i = 0; i < f.v.length; i++) {
    const r = f.rest[i], v = f.v[i];
    v[0] = r[0] + dx; v[1] = r[1] + dy; v[2] = r[2] + dz;
  }
  let cx = 0, cy = 0, cz = 0;

let bgGrad = null, bgKey = '';

function drawBackground() {
  const key = VW + 'x' + VH;
  if (!bgGrad || bgKey !== key) {
    bgKey = key;
    bgGrad = ctx.createLinearGradient(0, 0, 0, VH);
    bgGrad.addColorStop(0, '#05070e');
    bgGrad.addColorStop(0.42, '#0a1122');
    bgGrad.addColorStop(0.74, '#101c33');
    bgGrad.addColorStop(1, '#070b14');
  }

  ctx.fillStyle = bgGrad;

  const rr0 = Math.max(VW, VH) * 0.62;

  gr.addColorStop(0, 'rgba(74,104,152,0.30)');
  gr.addColorStop(0.42, 'rgba(48,72,112,0.15)');
  gr.addColorStop(1, 'rgba(20,32,58,0)');

/* ---------- additive bloom around every registered light ---------- */
function drawHalos() {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < HALOS.length; i++) {
    const g = HALOS[i];
    const inten = g.live ? g.live() : g.i;
    if (inten <= 0.005) continue;
    const q = proj(g.hi || g.p);
    if (!q.ok) continue;
    const r = screenR(g.r * 1.9, q.z);
    if (r < 1.5) continue;
    if (q.x < -r || q.x > VW + r || q.y < -r || q.y > VH + r) continue;
    const cs = g.c;
    const gr = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
    gr.addColorStop(0, 'rgba(' + cs[0] + ',' + cs[1] + ',' + cs[2] + ',' + (0.42 * inten).toFixed(3) + ')');
    gr.addColorStop(0.28, 'rgba(' + cs[0] + ',' + cs[1] + ',' + cs[2] + ',' + (0.16 * inten).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(' + cs[0] + ',' + cs[1] + ',' + cs[2] + ',0)');

    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, TAU); ctx.fill();

function drawBokeh(dt) {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < BOKEH.length; i++) {
    const b = BOKEH[i];
    if (!T.reduced) { b.y += b.s * dt; if (b.y > 1.15) { b.y = -0.15; b.x = rnd(); } }
    const x = (b.x + Math.sin(T.t * 0.25 + b.ph) * 0.012) * VW;
    const y = b.y * VH;
    const r = b.r * (VH / 720);
    ctx.globalAlpha = b.a * (T.quality >= 2 ? 1 : 0.6);
    ctx.drawImage(bokehSprite(b.tint), x - r, y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawVignette() {
  const g = ctx.createRadialGradient(VW * 0.5, SCY, Math.min(VW, VH) * 0.30,
    VW * 0.5, SCY, Math.max(VW, VH) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.62, 'rgba(3,6,12,0.18)');
  g.addColorStop(1, 'rgba(2,4,9,0.52)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  const t = ctx.createLinearGradient(0, 0, 0, VH * 0.22);
  t.addColorStop(0, 'rgba(2,4,10,0.40)');
  t.addColorStop(1, 'rgba(2,4,10,0)');
  ctx.fillStyle = t;
  ctx.fillRect(0, 0, VW, VH * 0.22);
}

/* ---------- cheap tilt-shift so the whole thing reads as a 1:87 model ---------- */
let blurCv = null, bctx = null, canFilter = null;

  blurCv.height = Math.max(2, Math.round(canvas.height * 0.5));
}
function tiltShift() {

      t.filter = 'blur(2px)';

  bctx.clearRect(0, 0, bw, bh);
  bctx.filter = 'blur(' + Math.max(1.6, bh * 0.006).toFixed(2) + 'px)';
  bctx.drawImage(canvas, 0, 0, bw, bh);
  bctx.filter = 'none';
  bctx.globalCompositeOperation = 'destination-in';
  const g = bctx.createLinearGradient(0, 0, 0, bh);
  g.addColorStop(0, 'rgba(0,0,0,0.92)');
  g.addColorStop(0.17, 'rgba(0,0,0,0.75)');
  g.addColorStop(0.40, 'rgba(0,0,0,0)');
  g.addColorStop(0.66, 'rgba(0,0,0,0)');
  g.addColorStop(0.86, 'rgba(0,0,0,0.72)');
  g.addColorStop(1, 'rgba(0,0,0,0.95)');

/* ---------- the frame ---------- */
let _drawCount = 0;
function renderFrame(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();

  let n = 0;
  for (let i = 0; i < DRAW.length; i++) {
    const it = DRAW[i];
    let ok;
    if (it.kind === 0) ok = prepFace(it);
    else if (it.kind === 1) ok = prepLine(it);
    else ok = prepGFX(it);
    if (ok) VIS[n++] = it;
  }
  VIS.length = n;
  VIS.sort(byDepth);
  _drawCount = n;

  for (let i = 0; i < n; i++) {
    const it = VIS[i];
    if (it.kind === 0) drawFace(it);
    else if (it.kind === 1) drawLine(it);
    else drawGFX(it);

  drawSplashes();

/* ===== 40-tex.js ===== */
/* =============================================================================
 * 40-tex.js — every pixel in the scene is generated here at load time:
 * road/tile surfaces, the store fascia, posters, shelf facings, the vending
 * machine face … No image files, no fonts fetched, nothing over the network.
 * ========================================================================== */

function mkTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  const g = c.getContext('2d');
  g.textBaseline = 'middle';
  g.textAlign = 'left';

}
const FONT = '"Helvetica Neue", "Arial Black", Arial, "Segoe UI", sans-serif';

function rrect(g, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.lineTo(x + w - rr, y); g.quadraticCurveTo(x + w, y, x + w, y + rr);
  g.lineTo(x + w, y + h - rr); g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  g.lineTo(x + rr, y + h); g.quadraticCurveTo(x, y + h, x, y + h - rr);
  g.lineTo(x, y + rr); g.quadraticCurveTo(x, y, x + rr, y);
  g.closePath();
}
function speckle(g, w, h, colr, n, amax) {
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * h, s = 0.6 + rnd() * 2.2;
    g.globalAlpha = rnd() * amax;
    g.fillStyle = colr;
    g.fillRect(x, y, s, s);
  }
  g.globalAlpha = 1;
}

/* ---------- fake Japanese lettering: deterministic kana-like glyphs ---------- */
function glyphStrokes(seed) {
  let s = seed * 2654435761 % 2147483647;
  const nx = () => { s = (s * 48271) % 2147483647; return s / 2147483647; };
  const out = [];
  const kind = Math.floor(nx() * 5);
  if (kind === 0) {                          // vertical + crossing stroke (ト/丿系)
    out.push(['l', 0.5 - 0.18 * nx(), 0.1, 0.5 + 0.2 * nx(), 0.9]);
    out.push(['l', 0.16, 0.3 + 0.2 * nx(), 0.86, 0.24 + 0.16 * nx()]);
  } else if (kind === 1) {                   // box with a bar (目/日系)
    out.push(['r', 0.2, 0.16, 0.6, 0.68]);
    out.push(['l', 0.2, 0.5, 0.8, 0.5]);
  } else if (kind === 2) {                   // loop + tail (まる/を系)
    out.push(['c', 0.36 + 0.12 * nx(), 0.36, 0.2]);
    out.push(['l', 0.62, 0.52, 0.58 + 0.2 * nx(), 0.92]);
  } else if (kind === 3) {                   // two horizontals + vertical (二/三系)
    out.push(['l', 0.16, 0.24 + 0.06 * nx(), 0.84, 0.22]);
    out.push(['l', 0.2, 0.6, 0.8, 0.58]);
    if (nx() > 0.4) out.push(['l', 0.5, 0.2, 0.48, 0.86]);
  } else {                                   // katakana-ish diagonal stack
    out.push(['l', 0.18, 0.18, 0.52, 0.5]);
    out.push(['l', 0.8, 0.2, 0.42, 0.86]);
    if (nx() > 0.5) out.push(['l', 0.66, 0.66, 0.88, 0.9]);

}
function pseudoWord(g, str, x, y, size, color, lwFrac) {
  const lw = size * (lwFrac || 0.16);

    if (str[i] === ' ') { cx += size * 0.45; continue; }
    const st = glyphStrokes(ch * 97 + i * 13 + 7);
    for (const c of st) {
      if (c[0] === 'l') {
        g.beginPath(); g.moveTo(cx + c[1] * size, y + c[2] * size); g.lineTo(cx + c[3] * size, y + c[4] * size); g.stroke();

        g.beginPath(); g.arc(cx + c[1] * size, y + c[2] * size, c[3] * size, 0, TAU); g.stroke();

﻿/* =============================================================================
 * 44-scene-base.js - the collectible base plate: plinth, road, kerbs, sidewalk,
 * tactile paving, crossings, gutters, the alley, the neighbour block, back lot.
 * Everything is built on one square base, tightly composed.
 * ========================================================================== */

const YROAD = 0.004, YWALK = 0.14, YAPRON = 0.158, YFLOOR = 0.185;

function buildBase() {
  /* ---------- the plinth itself ---------- */
  const t = PLINTH_T, H = HALF;
  boxG(-H, -t, -H, H, 0, H, {
    c: '#1a1f2b', bias: 40, lit: 'night', ink: 1.2,
    sides: { t: '#2a3140', b: '#0d1118' },
  });
  // chamfered upper edge + a thin display-model rim
  boxG(-H + 0.06, -0.1, -H + 0.06, H - 0.06, 0.0, H - 0.06, {
    c: '#232a38', bias: 40, ink: 0.9, sides: { t: '#20262f', b: '#0d1118' },
  });
  // top surface: damp concrete under everything
  gq(-H + 0.02, -H + 0.02, H - 0.02, H - 0.02, 0.006, {
    tex: TEX.plaster, tsize: [1.4, 1.4], c: '#2c333f', bias: 34, ink: 0,
  });

  /* ---------- roads (the L around the corner) ---------- */
  const RZ = L.roadS[0], RX = L.roadE[0];
  gq(-H, RZ, H, H - 0.04, YROAD, { tex: TEX.asphalt, tsize: [2.3, 2.3], c: '#232a39', bias: 33, ink: 0 });
  gq(RX, -H, H - 0.04, RZ, YROAD, { tex: TEX.asphalt, tsize: [2.3, 2.3], c: '#232a39', bias: 33, ink: 0 });

  /* ---------- sidewalk slabs (raised, with kerb stones) ---------- */
  // south sidewalk band
  boxG(-H, 0, L.walkS[0], H, YWALK, RZ, {
    tex: TEX.concrete, tsize: [1.15, 1.15], c: '#535b6b', bias: 30, ink: 0.9,
    sides: { t: null, b: '#2f3644', f: null, k: '#454d5c', r: '#454d5c', l: '#454d5c' },
  });
  // east sidewalk band, stops at the south band so the corner is one slab
  boxG(L.walkE[0], 0, -H, RX, YWALK, L.walkS[0], {
    tex: TEX.concrete, tsize: [1.15, 1.15], c: '#535b6b', bias: 30, ink: 0.9,
    sides: { t: null, b: '#2f3644', f: '#454d5c', k: '#454d5c', r: null, l: '#454d5c' },
  });
  kerbRun(RZ, 'z');                       // kerb stone along the south road
  kerbRun(RX, 'x');                       // and the east road

  /* ---------- painted asphalt markings ---------- */
  paintMarkings(RZ, RX);
  crossings(RZ, RX);

  /* ---------- gutters / drainage ---------- */
  gutterRun(RZ + 0.04, 'z');
  gutterRun(RX + 0.04, 'x');
  drainInlet(5.9, 3.1);
  drainInlet(-2.4, 5.4);
  gq(1.6, 6.2, 2.5, 6.9, YROAD + 0.003, { c: '#202632', bias: 32, ink: 0, tex: TEX.gutter, tsize: [0.9, 0.9] });
  manhole(-4.9, 5.5, 0.42);
  manhole(6.1, -3.6, 0.36);

  /* ---------- tactile paving + dropped-kerb ramps at the crossings ---------- */
  tactilePath();
  /* ---------- store apron (tiled, slightly higher than the sidewalk) ---------- */
  boxG(0.05, YWALK, L.store.z1, 2.68, YAPRON, 3.62, {
    tex: TEX.apron, tsize: [0.42, 0.42], c: '#7f8794', bias: 29, ink: 0.8,
  });
  // step at the doors
  boxG(0.4, 0.1, 3.62, 2.3, YWALK + 0.02, 3.74, { c: '#69717f', bias: 29, ink: 0.8 });

  /* ---------- the alley behind the west wall ---------- */
  alley(L.alley.x0, L.alley.x1, L.alley.z0, L.alley.z1);

  /* ---------- neighbour block + back lot + far roofs ---------- */
  neighbour(L.nb);
  backLot();
  parkingPad(L.lot);
}

/* small helpers ------------------------------------------------------------- */
function kerbRun(edge, axis) {
  const t = 0.19, h = YWALK;
  for (let a = -HALF + 0.06; a < HALF - 0.06; a += 1.05) {
    const b = Math.min(a + 1.0, HALF - 0.06);
    // skip the gaps where the crossings ramp down
    const gap = a > -1.4 && b < 2.05;   // the two crossings ramp down here
    if (gap) continue;
    if (axis === 'z') boxG(a, 0.02, edge - 0.02, b, h, edge + t, { c: '#7f8899', bias: 29, ink: 0.9, sides: { t: '#98a2b2' } });
    else boxG(edge - 0.02, 0.02, a, edge + t, h, b, { c: '#7f8899', bias: 29, ink: 0.9, sides: { t: '#98a2b2' } });
  }
}

function gutterRun(edge, axis) {
  const w = 0.26;
  if (axis === 'z') {
    gq(-HALF + 0.1, edge, HALF - 0.1, edge + w, YROAD + 0.006,
      { tex: TEX.gutter, tsize: [0.55, w], c: '#313844', bias: 31, ink: 0, tileN: 'y' });
  } else {
    gq(edge, -HALF + 0.1, edge + w, HALF - 0.1, YROAD + 0.006,
      { tex: TEX.gutter, tsize: [w, 0.55], c: '#313844', bias: 31, ink: 0, tileN: 'y' });

/* ---------- puddles: irregular wet mirrors that ripple ---------- */
function puddle(x, z, r, n, squash, y) {
  y = y === undefined ? YROAD + 0.018 : y;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const rad = r * (0.62 + 0.5 * Math.abs(Math.sin(a * 1.7 + x * 3)));
    pts.push([x + Math.cos(a) * rad, y, z + Math.sin(a) * rad * (squash || 0.7)]);
  }
  face(pts, { c: '#0d1420', al: 0.52, bias: 23, ink: 0 });
  const rim = pts.map((p) => [p[0], y + 0.001, p[2]]);
  face(rim, { c: '#63b8e8', al: 0.07, bias: 22, ink: 0, add: true });
  PUDDLES.push({ x: x, z: z, r: r, y: y });
}
const PUDDLES = [];

/* ---------- glazing ---------- */
function glassRun(axis, at, a0, a1, y0, y1, bays, opts) {
  opts = opts || {};

  for (let i = 0; i < bays; i++) {
    const s0 = a0 + i * span, s1 = s0 + span;
    const g0 = s0 + 0.055, g1 = s1 - 0.055;
    if (opts.skip && opts.skip(i, s0, s1)) continue;
    let f;
    if (axis === 'z') {
      f = wallZ(at, g0, g1, y0, y1, +1, { c: col(P.glass), al: 0.15, bias: -0.9, ink: 0.55, cull: false, inkc: col('#2b4055') });
      face([[g1, y1, at + 0.004], [g0, y1, at + 0.004], [g0, y0, at + 0.004], [g1, y0, at + 0.004]],
        { c: '#a8ddff', al: 0.05, bias: -1.0, ink: 0, add: true, cull: false });
      pane([g0, y0, at], [g1 - g0, 0, 0], [0, y1 - y0, 0], g1 - g0, y1 - y0);
    } else {
      f = wallX(at, g1, g0, y0, y1, +1, { c: col(P.glass), al: 0.15, bias: -0.9, ink: 0.55, cull: false, inkc: col('#2b4055') });
      face([[at + 0.004, y1, g0], [at + 0.004, y1, g1], [at + 0.004, y0, g1], [at + 0.004, y0, g0]],
        { c: '#a8ddff', al: 0.05, bias: -1.0, ink: 0, add: true, cull: false });
      pane([at, y0, g1], [0, 0, g0 - g1], [0, y1 - y0, 0], Math.abs(g0 - g1), y1 - y0);
    }
    // mullions
    for (const m of [s0, s1]) {
      if (axis === 'z') boxC(m, (y0 + y1) / 2, at, 0.09, y1 - y0, 0.14, { c: frameC, bias: 0, ink: 0.9, sides: { t: '#e2e8ee' } });
      else boxC(at, (y0 + y1) / 2, m, 0.14, y1 - y0, 0.09, { c: frameC, bias: 0, ink: 0.9, sides: { t: '#e2e8ee' } });
    }
  }
  // head + sill rails
  if (axis === 'z') {
    boxC((a0 + a1) / 2, y1 + 0.045, at, a1 - a0, 0.1, 0.15, { c: frameC, bias: 0, ink: 0.8 });
    boxC((a0 + a1) / 2, y0 - 0.03, at, a1 - a0, 0.07, 0.16, { c: '#b9c2cc', bias: 0, ink: 0.8 });
  } else {
    boxC(at, y1 + 0.045, (a0 + a1) / 2, 0.15, 0.1, a1 - a0, { c: frameC, bias: 0, ink: 0.8 });
    boxC(at, y0 - 0.03, (a0 + a1) / 2, 0.16, 0.07, a1 - a0, { c: '#b9c2cc', bias: 0, ink: 0.8 });
  }
}

function decal(axis, at, a0, a1, y0, y1, tex, alpha) {
  if (axis === 'z') wallZ(at + 0.012, a0, a1, y0, y1, +1, { tex: tex, uv: [0, 0, 1, 1], c: '#ffffff', em: 0.55, bias: -1.1, ink: 0, al: alpha === undefined ? 0.9 : alpha });
  else wallX(at + 0.012, a1, a0, y0, y1, +1, { tex: tex, uv: [0, 0, 1, 1], c: '#ffffff', em: 0.55, bias: -1.1, ink: 0, al: alpha === undefined ? 0.9 : alpha });
}

/* ---------- doors ---------- */
function autoDoor(z, x0, x1) {
  const yc = 2.62, y0 = 0.24, h = yc - y0, mid = (x0 + x1) / 2, w = (x1 - x0) / 2;
  // frame
  boxC(x0 - 0.05, (y0 + yc) / 2, z, 0.1, h, 0.2, { c: '#b7c0ca', bias: 0, ink: 0.9 });
  boxC(x1 + 0.05, (y0 + yc) / 2, z, 0.1, h, 0.2, { c: '#b7c0ca', bias: 0, ink: 0.9 });
  boxC(mid, yc + 0.06, z, x1 - x0 + 0.3, 0.14, 0.2, { c: '#c7cfd8', bias: 0, ink: 0.9, sides: { t: '#dfe6ec' } });
  // sensor + indicator
  boxC(mid, yc - 0.02, z + 0.11, 0.36, 0.09, 0.06, { c: '#39404b', bias: 0, ink: 0.7 });
  const led = wallZ(z + 0.145, mid - 0.11, mid - 0.05, yc - 0.05, yc - 0.015, +1,
    { c: '#49e08a', em: 1, lit: 'none', bias: 0, ink: 0 });
  led.anim = () => { const o = DOOR.open > 0.05 ? 1 : 0.35; led.c = o > 0.5 ? col('#4dffa0') : col('#2f7f57'); };
  ANIMS.push(led);
  // two sliding leaves
  for (const side of [-1, 1]) {
    const bx0 = side < 0 ? x0 : mid, bx1 = side < 0 ? mid : x1;
    const zz = z + 0.03;
    const gl = wallZ(zz, bx0 + 0.02, bx1 - 0.02, y0 + 0.02, yc - 0.02, +1,
      { c: col(P.glass), al: 0.2, bias: -0.8, ink: 0.7, cull: false, inkc: col('#2b4055') });
    const rail = boxC((bx0 + bx1) / 2, y0 + 0.14, zz, bx1 - bx0 - 0.02, 0.12, 0.045, { bias: -0.8, c: '#dfe6ec', ink: 0.8 });
    const top = boxC((bx0 + bx1) / 2, yc - 0.06, zz, bx1 - bx0 - 0.02, 0.09, 0.045, { bias: -0.8, c: '#dfe6ec', ink: 0.8 });
    const handle = boxC(side < 0 ? bx1 - 0.14 : bx0 + 0.14, 1.35, zz + 0.03, 0.05, 0.5, 0.05, { bias: -0.8, c: '#8f9aa6', ink: 0.8 });
    const set = [gl, rail, top, handle].flatMap((f) => (Array.isArray(f) ? f.filter(Boolean) : [f]));
    (side < 0 ? DOOR.left : DOOR.right).push(...set);
    for (const f of set) {
      capture(f);
      f.anim = () => moveBy(f, side * DOOR.open * (w - 0.04), 0, 0);
      ANIMS.push(f);
    }
  }
  // a small green LED strip on the floor edge of the doors + a jidou-dou decal
  decal('z', z + 0.02, mid - 0.62, mid + 0.62, yc - 0.3, yc - 0.16, TEX.windowBand, 0.75);
}

function signage() {
  const y0 = 3.28, y1 = 4.3;
  /* fascia sign, wrapping both street faces */
  boxG(S.x0 - 0.06, y0, S.z1 + 0.02, S.x1 + 0.06, y1, S.z1 + 0.24, {
    c: '#dfe4ea', bias: 0, ink: 1.1, sides: { f: '#1e8a63', t: '#e7ecf1', b: '#9aa4b0' },
  });
  wallZ(S.z1 + 0.25, S.x0 - 0.06, S.x1 + 0.06, y0, y1, +1,
    { tex: TEX.signMain, uv: [0, 0, 1, 1], c: '#ffffff', em: 0.86, bias: -0.4, ink: 1.0 });
  boxG(S.x1 + 0.02, y0, S.z0 - 0.06, S.x1 + 0.24, y1, S.z1 + 0.24, {
    c: '#dfe4ea', bias: 0, ink: 1.1, sides: { r: '#1e8a63', t: '#e7ecf1' },
  });
  wallX(S.x1 + 0.25, S.z1 - 0.05, S.z0 + 0.4, y0, y1, +1,
    { c: BRAND.deep, em: 0.3, bias: 0, ink: 1.0 });
  for (const [a, b, txt] of [[S.z1 - 0.1, S.z1 - 1.3, 1], [S.z1 - 1.35, S.z1 - 2.6, 1], [S.z1 - 2.65, S.z0 + 0.4, 1]]) {
    wallX(S.x1 + 0.26, b, a, y0 + 0.12, y1 - 0.12, +1,
      { c: BRAND.mint, em: 0.8, bias: -0.3, ink: 0.7 });
  }
  /* blade sign on the corner pillar: one box, two street-facing lit faces */
  const bx = S.x1 + 0.46, bz = S.z1 + 0.46;
  boxC(bx, 1.9, bz, 0.16, 1.5, 0.16, { c: '#5b6573', bias: 0, ink: 1.0 });
  boxC(bx, 3.62, bz, 0.7, 2.25, 0.7, {
    c: BRAND.deep, bias: 0, ink: 1.1, sides: { t: '#2a3644', b: '#2a3644', r: '#1e8a63', f: '#1e8a63' },
  });
  const bladeFace = wallX(bx + 0.36, bz - 0.34, bz + 0.34, 2.55, 4.68, +1,
    { tex: TEX.signSide, uv: [0, 0, 1, 1], c: '#ffffff', em: 0.9, bias: -0.5, ink: 1.0 });
  const bladeFace2 = wallZ(bz + 0.36, bx - 0.34, bx + 0.34, 2.55, 4.68, +1,
    { tex: TEX.signSide, uv: [0, 0, 1, 1], c: '#ffffff', em: 0.82, bias: -0.5, ink: 1.0 });
  // a flicker driver sits on both faces + their light
  let fl = 1;
  const flick = () => {
    if (T.reduced) return 1;
    const t = T.t;
    const base = 0.93 + 0.07 * Math.sin(t * 1.7);
    const buzz = (t % 9.4) > 9.15 ? 0.42 + 0.3 * Math.sin(t * 90) : 1;
    const dip = (t % 23.0) > 22.82 ? 0.6 : 1;
    fl = clamp(base * buzz * dip, 0.2, 1);
    return fl;
  };
  bladeFace.anim = (f) => { f.em = 0.9 * flick(); };
  bladeFace2.anim = (f) => { f.em = 0.82 * flick(); };
  ANIMS.push(bladeFace, bladeFace2);
  const signLight = light([bx, 3.7, bz], '#5bf0c0', 4.6, 0.5, flick);
  glow([S.x1 + 0.1, YWALK + 0.01, S.z1 + 0.5], '#3fe0b0', 1.7, 0.4, 'pool+smear', flick, [bx, 3.6, bz]);
  // the fascia glows too - mint spill over the wet apron
  glow([S.x0 / 2, YAPRON + 0.01, S.z1 + 0.55], '#41d8a8', 2.9, 0.3, 'pool', flick, [S.x0 / 2, y0, S.z1]);
  light([0.2, 3.7, S.z1 + 0.2], '#63e6bc', 4.0, 0.32, flick);

  /* a wall-hung emblem + the store's opening hours band */
  wallZ(S.z1 + 0.26, 1.9, 2.55, 4.34, 4.62, +1, { c: BRAND.warm, em: 0.95, bias: 0, ink: 0.9 });
  pseudoSignPlate(S.x0 + 0.35, S.z1 + 0.26, 4.34, 4.62, 1.2);
}

function buildStore() {

/* ===== 60-scene-interior.js ===== */
/* =============================================================================
 * 60-scene-interior.js — everything that makes the shop glow: gondolas with
 * product facings, the multi-door cooler, bento + oden counters, the register,
 * coffee, chest freezers, hanging light boxes, lockers, back-room door.
 * Coordinates are inside IN = {x0,x1,z0,z1} with the floor at YFLOOR.
 * ========================================================================== */

const YF = YFLOOR + 0.012;
/* product facings: a touch of self-illumination so the packet colours survive
 * the flat interior ramp instead of washing out to white */
const PROD = { lit: 'inside', em: 0.3, ink: 0.55, inkc: col('#6a7280') };

/* a gondola run: `axis` is the direction the run extends along, `at` is the
 * cross-axis position, run0..run1 the length. Products face both aisles. */
function gondola(axis, run0, run1, at, opts) {
  opts = opts || {};
  const h = opts.h || 1.62, y0 = YF, dz = opts.depth || 0.46;
  const tex = opts.tex || TEX.shelfChip, ts = opts.tsize || [1.9, 1.24];
  const c = opts.body || '#e2e8ee';
  const rc = (run0 + run1) / 2, rl = run1 - run0;
  if (axis === 'z') {
    boxG(at - dz / 2, y0, run0, at + dz / 2, y0 + h, run1, { c: c, ink: 0.7, inkc: col('#8b94a2'), sides: { t: '#dfe5eb', b: '#b9c2cd' } });
    for (const s of [-1, 1]) {
      wallX(at + s * (dz / 2 + 0.012), s > 0 ? run1 : run0, s > 0 ? run0 : run1, y0 + 0.3, y0 + h - 0.05, s,
        Object.assign({}, PROD, { tex: tex, tsize: ts }));
      if (opts.cap) {
        wallX(at + s * (dz / 2 + 0.02), s > 0 ? run1 - 0.35 : run0 + 0.35, s > 0 ? run0 + 0.35 : run1 - 0.35,
          y0 + 0.16, y0 + h - 0.12, s, Object.assign({}, PROD, { tex: opts.cap, uv: [0, 0, 1, 1], em: 0.28 }));
      }
    }
    for (const [e, sg] of [[run0, -1], [run1, 1]]) {
      wallZ(e, at + sg * dz / 2, at - sg * dz / 2, y0 + 0.06, y0 + h, sg, { c: '#d7dee6', ink: 0.7, inkc: col('#8b94a2') });
    }
    for (let i = 1; i <= 3; i++) {
      const y = y0 + 0.3 + i * ((h - 0.35) / 3.4);
      boxG(at - dz / 2 - 0.02, y, run0 - 0.015, at + dz / 2 + 0.02, y + 0.03, run1 + 0.015, { c: '#e9eef3', ink: 0.5, inkc: col('#8b94a2') });
    }
    if (opts.header) {
      for (const s of [-1, 1]) {
        wallX(at + s * (dz / 2 + 0.014), s > 0 ? run1 - 0.2 : run0 + 0.2, s > 0 ? run0 + 0.2 : run1 - 0.2, y0 + h + 0.04, y0 + h + 0.28, s,
          Object.assign({}, PROD, { tex: TEX.posterSale, uv: [0, 0, 1, 1], c: '#2f7fb8', em: 0.55, ink: 0.6 }));
      }
    }
  } else {
    boxG(run0, y0, at - dz / 2, run1, y0 + h, at + dz / 2, { c: c, ink: 0.7, inkc: col('#8b94a2'), sides: { t: '#dfe5eb', b: '#b9c2cd' } });
    for (const s of [-1, 1]) {
      wallZ(at + s * (dz / 2 + 0.012), s > 0 ? run0 : run1, s > 0 ? run1 : run0, y0 + 0.3, y0 + h - 0.05, s,
        Object.assign({}, PROD, { tex: tex, tsize: ts }));
    }
    for (const [e, sg] of [[run0, -1], [run1, 1]]) {
      wallX(e, at - dz / 2, at + dz / 2, y0 + 0.06, y0 + h, sg, { c: '#d7dee6', ink: 0.7, inkc: col('#8b94a2') });
    }
    for (let i = 1; i <= 3; i++) {
      const y = y0 + 0.3 + i * ((h - 0.35) / 3.4);
      boxG(run0 - 0.015, y, at - dz / 2 - 0.02, run1 + 0.015, y + 0.03, at + dz / 2 + 0.02, { c: '#e9eef3', ink: 0.5, inkc: col('#8b94a2') });
    }
    if (opts.header) {
      wallZ(at + dz / 2 + 0.014, run0 + 0.2, run1 - 0.2, y0 + h + 0.04, y0 + h + 0.3, +1,
        Object.assign({}, PROD, { tex: TEX.lightbox, tsize: [0.9, 0.26], em: 0.8 }));
    }
  }
}

/* the wall of glass-door coolers */
function coolerRun(x0, x1, z, h) {
  const y0 = YF, doors = Math.max(2, Math.round((x1 - x0) / 1.05));
  boxG(x0, y0, z - 0.34, x1, y0 + h + 0.28, z, { c: '#e8edf2', ink: 0.8, inkc: col('#8b94a2'), sides: { t: '#f4f8fb', k: '#cfd7df' } });
  boxG(x0 + 0.06, y0 + 0.05, z - 0.32, x1 - 0.06, y0 + h, z - 0.06, { c: '#1a2129', ink: 0, lit: 'inside' });
  // the lit interior of the cabinet, tiled with bottles
  wallZ(z - 0.055, x0 + 0.06, x1 - 0.06, y0 + 0.08, y0 + h - 0.05, +1,
    Object.assign({}, PROD, { tex: TEX.fridgeFace, tsize: [1.15, h - 0.13], em: 0.35 }));
  // glass doors + vertical mullions + handles
  const dw = (x1 - x0) / doors;
  for (let i = 0; i <= doors; i++) {
    boxC(x0 + i * dw, y0 + h / 2, z - 0.05, 0.07, h + 0.1, 0.08, { c: '#c3ccd6', ink: 0.7, inkc: col('#8b94a2') });
  }
  for (let i = 0; i < doors; i++) {
    wallZ(z + 0.005, x0 + i * dw + 0.05, x0 + (i + 1) * dw - 0.05, y0 + 0.1, y0 + h - 0.02, +1,
      { c: col('#cfeeff'), al: 0.13, ink: 0.5, inkc: col('#4d6a80'), cull: false, bias: -0.4 });
    boxC(x0 + (i + 1) * dw - 0.14, y0 + h * 0.52, z - 0.02, 0.04, 0.34, 0.05, { c: '#9aa4b0', ink: 0.6 });
  }
  // the glow strip along the top + a cool light inside the shop
  wallZ(z + 0.01, x0 + 0.05, x1 - 0.05, y0 + h + 0.06, y0 + h + 0.24, +1,
    { c: '#eaf6ff', em: 0.95, lit: 'none', ink: 0 });
  light([(x0 + x1) / 2, y0 + h * 0.6, z - 0.4], '#cfe9ff', 3.2, 0.4);
}

function hangingBoxes() {
  // small ceiling banners over the aisles: colour without blocking the view
  const spots = [[-2.15, 0.35], [-0.95, 0.55], [-0.95, -1.15], [0.3, -0.15]];
  for (const [x, z] of spots) {
    const y = YC - 0.2, w = 0.46, h = 0.3;
    boxC(x, y, z, 0.06, h, w, { c: '#eef2f6', ink: 0.5, inkc: col('#93a0ae'), sides: { t: '#f8fbff' } });
    // the ad panels are the wide faces of the box, i.e. the ones normal to x
    for (const s of [-1, 1]) {
      wallX(x + s * 0.034, s > 0 ? z + w / 2 : z - w / 2, s > 0 ? z - w / 2 : z + w / 2, y - h / 2 + 0.03, y + h / 2 - 0.03, s,

    }
    boxC(x, YC - 0.05, z, 0.04, 0.24, 0.04, { c: '#c3ccd6', ink: 0.3 });

  }
}

  boxC(IN.x0 + 1.4, YF + 0.42, -2.4, 0.7, 0.7, 0.5, { c: '#a9b3bd', ink: 0.7 });
  // a shelf of pet food / daily goods against the west wall
  gondola('z', 0.15, 1.55, -2.85, { h: 1.5, depth: 0.44, tex: TEX.shelfPlain, tsize: [1.0, 1.1] });
  // ceiling spot lights over the register
  for (const z of [0.4, 1.1, 1.8]) {
    cyl(IN.x1 - 0.5, YC - 0.06, z, 0.11, 0.1, 'y', 8, { c: '#fff6e4', em: 1, lit: 'none', ink: 0.4, capInk: 0.4 });
  }
  light([IN.x1 - 0.6, YC - 0.3, 1.1], '#ffe9c4', 3.4, 0.45);
  // warm general fill: bright inside, but it stops at the glazing so the
  // street stays cold and the shop reads as a lit box
  light([0, YF + 1.55, -0.4], '#ffe3b8', 5.1, 0.34);
  light([-1.3, YF + 1.5, 0.9], '#ffeed0', 3.6, 0.2);
  light([1.4, YF + 1.5, -1.6], '#ffe9cc', 3.4, 0.18);
}

function buildInterior() {
  FORCE_LIT = 'inside';

  gondola('z', -0.85, 1.6, -2.15, { h: 1.55, tex: TEX.shelfOnigiri, tsize: [1.7, 1.15], header: true, cap: TEX.posterSale });
  gondola('z', -0.9, 1.7, -0.95, { h: 1.62, tex: TEX.shelfChip, tsize: [1.9, 1.24], cap: TEX.posterFilm });

/* ===== 70-scene-props.js ===== */
﻿/* =============================================================================
 * 70-scene-props.js - the street furniture that turns a box into a corner:
 * utility poles + catenaries, lamps, signals, guards, signage, vending machine,
 * bicycles, a parked kei car, a post box, hydrant, bollards.
 * ========================================================================== */

const SIGNALS = [];                 // heads to cycle
const DRIP = [];                    // eave / unit drip emitters {x,y,z,rate}

/* ---------- utility pole ---------- */
function pole(x, z, h, opts) {
  opts = opts || {};
  const c = '#6d7683';
  cyl(x, h / 2, z, 0.115, h, 'y', 9, { c: c, ink: 0.9, inkc: col('#2c333f'), caps: false });
  cyl(x, h - 0.05, z, 0.14, 0.3, 'y', 9, { c: '#7f8895', ink: 0.7 });
  // cross arms + insulators + transformer
  for (const [ay, aw] of [[h - 0.75, 1.5], [h - 1.35, 1.1]]) {
    boxC(x, ay, z, aw, 0.09, 0.11, { c: '#7c8593', ink: 0.8 });
    for (const s of [-1, 1]) {
      boxC(x + s * (aw / 2 - 0.1), ay + 0.11, z, 0.09, 0.16, 0.09, { c: '#4f6f8a', ink: 0.7 });
    }
  }
  if (opts.transformer !== false) {
    boxC(x + 0.34, h - 1.9, z, 0.42, 0.62, 0.34, { c: '#5f6875', ink: 0.9, sides: { t: '#6e7784' } });
    poly([[x + 0.12, h - 1.6, z], [x + 0.34, h - 1.55, z]], { c: '#525b68', w: 1.6 });
  }
  // service ladder rungs + a small plaque
  for (let i = 0; i < 4; i++) boxC(x, 1.1 + i * 0.26, z + 0.12, 0.22, 0.03, 0.03, { c: '#7f8895', ink: 0.4 });
  boxC(x - 0.16, 2.1, z, 0.05, 0.34, 0.26, { c: '#9aa3b0', ink: 0.6 });
  if (opts.base !== false) cyl(x, 0.06, z, 0.24, 0.12, 'y', 10, { c: '#525b68', ink: 0.8 });
  return { x: x, z: z, h: h, top: [x, h - 0.45, z], mid: [x, h - 1.3, z], low: [x, h - 1.95, z] };
}

function buildPolesWires() {
  const p1 = pole(3.52, -2.35, 6.3);
  const p2 = pole(6.42, -4.85, 6.0);
  const p3 = pole(-4.75, 3.88, 5.7, { transformer: false });
  const wireC = { c: '#141a22', w: 1.5, ink: 0.5, al: 0.95 };
  const wireC2 = { c: '#1b222c', w: 1.2, al: 0.9 };
  // main runs
  wire(p1.mid, p2.mid, 0.55, 14, wireC);
  wire(p1.low, p2.low, 0.42, 14, wireC2);
  wire(p1.mid, p3.mid, 0.9, 18, wireC);
  wire(p1.low, p3.low, 0.75, 18, wireC2);
  wire(p3.mid, [-HALF + 0.05, p3.h - 1.4, p3.z], 0.3, 8, wireC);
  // service drops onto the shop and the neighbour
  wire(p1.mid, [L.store.x1 + 0.3, 3.15, -1.35], 0.22, 9, wireC2);
  boxC(L.store.x1 + 0.24, 3.15, -1.35, 0.14, 0.16, 0.1, { c: '#7a8390', ink: 0.6 });
  wire(p1.mid, [L.nb.x1 - 0.1, 4.2, 1.9], 0.3, 9, wireC2);
  wire(p3.top, [-4.7, 5.0, 3.2], 0.16, 6, wireC2);
  // a messenger strand with three little clamps for scale
  wire(p2.mid, [HALF - 0.05, p2.h - 1.4, -6.9], 0.4, 8, wireC);
  // power box on the wall of the shop
  boxC(L.store.x1 + 0.12, 1.45, -2.9, 0.14, 0.5, 0.42, { c: '#8b95a3', ink: 0.8 });
}

/* ---------- street lamps ---------- */
function lamp(x, z, h, warm, arm) {
  const c = warm ? '#7a828f' : '#828b98';
  cyl(x, 0.09, z, 0.2, 0.18, 'y', 10, { c: '#4e5765', ink: 0.8 });
  cyl(x, h / 2, z, 0.075, h, 'y', 8, { c: c, ink: 0.8, inkc: col('#2c333f') });
  // the arm reaches over the carriageway
  const dir = arm || [0.62, 0, 0.78];
  const tip = [x + dir[0], h + 0.12, z + dir[2]];
  poly([[x, h - 0.05, z], [x + dir[0] * 0.5, h + 0.1, z + dir[2] * 0.5], tip],
    { c: c, w: 2.6, ink: 0.4 });
  boxC(tip[0], tip[1] + 0.04, tip[2], 0.44, 0.1, 0.24, { c: '#9aa3b0', ink: 0.8, sides: { t: '#b3bcc8' } });
  const lens = gq(tip[0] - 0.19, tip[2] - 0.1, tip[0] + 0.19, tip[2] + 0.1, tip[1] - 0.02,
    { c: warm ? '#ffdda8' : '#f4f9ff', em: 1, lit: 'none', ink: 0.5, inkc: col('#6f6033'), sgn: -1 });
  const tint = warm ? P.sodium : P.led;
  light(tip, tint, 5.6, warm ? 0.62 : 0.5, () => (T.reduced ? 1 : 0.94 + 0.06 * Math.sin(T.t * 31 + x * 3)));
  glow(tip, tint, 0.6, 0.7, 'halo');
  glow([tip[0], YROAD + 0.01, tip[2]], tint, 2.5, warm ? 0.5 : 0.42, 'pool+smear', null, tip);
  // the cone of light itself, as a soft additive quad under the fitting
  DRIP.push({ x: tip[0], y: tip[1] - 0.1, z: tip[2], rate: 0.35, fromLamp: 1 });
  return { x: x, z: z, tip: tip };
}

function buildLamps() {
  lamp(3.95, 3.2, 4.3, false, [1.05, 0, 1.15]);     // the corner, cool LED
  lamp(-4.9, 3.72, 4.5, true, [-0.9, 0, 1.1]);      // down the south street, sodium
  lamp(6.3, 2.05, 4.1, false, [-0.75, 0, 0.5]);     // far side of the east road
  // a warm wall light over the shop's side door area
  const wl = [L.store.x1 + 0.18, 2.5, 1.9];
  boxC(wl[0], wl[1], wl[2], 0.1, 0.14, 0.2, { c: '#c9d2dc', ink: 0.7 });
  gq(wl[0] - 0.02, wl[2] - 0.08, wl[0] + 0.16, wl[2] + 0.08, wl[1] - 0.08,
    { c: '#ffe6bf', em: 1, lit: 'none', ink: 0 });
  light([wl[0] + 0.1, wl[1], wl[2]], '#ffd9a8', 3.2, 0.5);
}

/* ---------- traffic signals ---------- */
function signalHead(x, y, z, faceAxis, sgn, phase, scale) {
  scale = scale || 1;
  const w = 0.34 * scale, h = 0.98 * scale, d = 0.26 * scale;
  const box = faceAxis === 'z'
    ? boxG(x - w / 2, y - h / 2, z - d / 2, x + w / 2, y + h / 2, z + d / 2, { c: '#2b323b', ink: 0.9, sides: { f: '#232a33' } })
    : boxG(x - d / 2, y - h / 2, z - w / 2, x + d / 2, y + h / 2, z + w / 2, { c: '#2b323b', ink: 0.9, sides: { r: '#232a33' } });
  const order = [
    { key: 'red', hex: '#ff4a3c', dy: h * 0.31 },
    { key: 'amber', hex: '#ffb03a', dy: 0 },
    { key: 'green', hex: '#43e07a', dy: -h * 0.31 },
  ];
  for (const o of order) {
    const f = faceAxis === 'z'
      ? wallZ(z + sgn * (d / 2 + 0.005), x - w * 0.28, x + w * 0.28, y + o.dy - 0.11 * scale, y + o.dy + 0.11 * scale, sgn > 0 ? 1 : -1,
        { c: col('#3a4149'), em: 0.1, lit: 'none', ink: 0.6, inkc: col('#1a2027') })
      : wallX(x + sgn * (d / 2 + 0.005), z - sgn * w * 0.28, z + sgn * w * 0.28, y + o.dy - 0.11 * scale, y + o.dy + 0.11 * scale, sgn,
        { c: col('#3a4149'), em: 0.1, lit: 'none', ink: 0.6, inkc: col('#1a2027') });
    f.rest = f.v.map((v) => v.slice());
    const entry = {
      f: f, key: o.key, hex: o.hex, phase: phase, v: 0,
      pos: [faceAxis === 'z' ? x : x + sgn * (d / 2 + 0.25), y + o.dy, faceAxis === 'z' ? z + sgn * (d / 2 + 0.25) : z],
    };
    SIGNALS.push(entry);
    const live = () => entry.v * (o.key === 'ped' ? 0.7 : 1);
    glow(entry.pos, o.hex, 0.3 * scale, 0, 'halo', live);
    light(entry.pos, o.hex, 1.9 * scale, 0, live);
  }
  // visors
  for (const o of order) {
    if (faceAxis === 'z') boxG(x - w * 0.34, y + o.dy + 0.1, z + sgn * d / 2, x + w * 0.34, y + o.dy + 0.16, z + sgn * (d / 2 + 0.1), { c: '#39414b', ink: 0.5 });
    else boxG(x + sgn * d / 2, y + o.dy + 0.1, z - w * 0.34, x + sgn * (d / 2 + 0.1), y + o.dy + 0.16, z + w * 0.34, { c: '#39414b', ink: 0.5 });
  }
}

function buildSignals() {
  const px = 4.05, pz = 4.42;
  cyl(px, 2.2, pz, 0.1, 4.4, 'y', 8, { c: '#6f7886', ink: 0.8, inkc: col('#2c333f') });
  cyl(px, 0.06, pz, 0.2, 0.12, 'y', 10, { c: '#4c5563', ink: 0.7 });
  poly([[px, 4.25, pz], [px + 1.55, 4.3, pz]], { c: '#6f7886', w: 3.4, ink: 0.4 });
  poly([[px + 0.2, 4.2, pz], [px + 1.5, 4.3, pz]], { c: '#6f7886', w: 1.6 });
  signalHead(px + 1.55, 3.9, pz, 'z', -1, 0, 0.9);          // for the east road
  signalHead(px, 3.55, pz, 'x', -1, 0, 0.9);                // for the south road
  // pedestrian signals on the corner: one facing the crossing, one facing the street
  for (const [sx, sz, ax, sg] of [[px - 0.35, pz + 0.25, 'z', 1], [px + 0.35, pz - 0.3, 'x', 1]]) {
    boxC(sx, 2.55, sz, ax === 'z' ? 0.3 : 0.24, 0.62, ax === 'z' ? 0.24 : 0.3, { c: '#2f363f', ink: 0.8 });
    const f = ax === 'z'
      ? wallZ(sz + sg * 0.13, sx - 0.11, sx + 0.11, 2.4, 2.72, sg, { c: col('#3a4149'), em: 0.1, lit: 'none', ink: 0.5 })
      : wallX(sx + sg * 0.13, sz - 0.11, sz + 0.11, 2.4, 2.72, sg, { c: col('#3a4149'), em: 0.1, lit: 'none', ink: 0.5 });
    // walk matches the phase-0 vehicle heads' red interval
    SIGNALS.push({ f: f, key: 'ped', hex: '#ff8b4a', phase: 0, pos: [sx, 2.56, sz] });
  }
  // the small repeater on a low pole by the far crossing, so the change reads twice
  cyl(6.55, 1.35, 4.75, 0.07, 2.7, 'y', 7, { c: '#727b89', ink: 0.7 });
  signalHead(6.55, 2.2, 4.75, 'z', -1, 0.5, 0.62);
}

/* ---------- pedestrian guard rails, bollards, signs ---------- */
function guardRail(x0, z0, x1, z1, n) {
  const dx = (x1 - x0) / n, dz = (z1 - z0) / n;
  for (let i = 0; i <= n; i++) {
    const px = x0 + dx * i, pz = z0 + dz * i;
    boxC(px, 0.45, pz, 0.06, 0.9, 0.06, { c: '#93a1b2', ink: 0.7 });
  }
  for (const h of [0.84, 0.55]) {
    poly([[x0, h, z0], [x1, h, z1]], { c: '#c8d3df', w: 3.2, ink: 0.55 });
  }
  poly([[x0, 0.9, z0], [x1, 0.9, z1]], { c: '#dbe4ee', w: 2.0 });
}

function plate(x, y, z, kind, sgnAxis, sgn) {
  const s = 0.32;
  if (kind === 'stop') {
    const pts = [];
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + Math.PI / 8;
      pts.push([sgnAxis === 'z' ? x + Math.cos(a) * s : x + sgn * 0.01, y + Math.sin(a) * s, sgnAxis === 'z' ? z + sgn * 0.01 : z + Math.cos(a) * s]);
    }
    face(pts, { c: '#c8402f', em: 0.5, ink: 1.0, inkc: col('#5d2018'), n: sgnAxis === 'z' ? [0, 0, sgn] : [sgn, 0, 0] });
    const inner = pts.map((p) => [p[0] + (sgnAxis === 'z' ? 0 : sgn * 0.004), p[1], p[2] + (sgnAxis === 'z' ? sgn * 0.004 : 0)]);
    face(inner, { c: '#e8e4dc', al: 0.22, em: 0.4, ink: 0.5, bias: -0.1, n: sgnAxis === 'z' ? [0, 0, sgn] : [sgn, 0, 0] });
    // three abstract white strokes stand in for the tomare marking
    const ox = sgnAxis === 'z' ? x : x + sgn * 0.006, oz = sgnAxis === 'z' ? z + sgn * 0.006 : z;
    for (let i = 0; i < 3; i++) {
      poly([[ox - s * 0.5 + i * s * 0.36, y + s * 0.3 - i * s * 0.2, oz],
            [ox - s * 0.18 + i * s * 0.36, y - s * 0.34 + i * s * 0.12, oz]],
        { c: '#f2f2ee', w: 2.4, bias: -0.2 });
    }
  } else if (kind === 'cross') {
    const pts = [];
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + Math.PI / 4;
      pts.push([sgnAxis === 'z' ? x + Math.cos(a) * s : x + sgn * 0.01, y + Math.sin(a) * s, sgnAxis === 'z' ? z + sgn * 0.01 : z + Math.cos(a) * s]);
    }
    face(pts, { c: '#2f5f9e', em: 0.5, ink: 1.0, inkc: col('#16283f'), n: sgnAxis === 'z' ? [0, 0, sgn] : [sgn, 0, 0] });
    // a stick figure mid-stride
    poly([[x - 0.02, y + 0.12, z], [x + 0.02, y - 0.12, z]], { c: '#eef3f8', w: 2.4 });
    poly([[x - 0.09, y + 0.02, z], [x + 0.09, y + 0.05, z]], { c: '#eef3f8', w: 2.2 });
  } else if (kind === 'speed') {
    face([[x - (sgnAxis === 'z' ? s : 0.004), y - s, z - (sgnAxis === 'z' ? 0.004 : s)],
          [x + (sgnAxis === 'z' ? s : 0.004), y - s, z + (sgnAxis === 'z' ? 0.004 : s)],
          [x + (sgnAxis === 'z' ? s : 0.004), y + s, z + (sgnAxis === 'z' ? 0.004 : s)],
          [x - (sgnAxis === 'z' ? s : 0.004), y + s, z - (sgnAxis === 'z' ? 0.004 : s)]],
      { c: '#eef2f6', em: 0.5, ink: 0.5, bias: -0.1, n: sgnAxis === 'z' ? [0, 0, sgn] : [sgn, 0, 0] });
    ring(x, y, z, s * 0.86, sgnAxis === 'z' ? 'z' : 'x', 14, { c: '#c8402f', w: 4.4, bias: -0.2 });
    poly([[x - (sgnAxis === 'z' ? 0.006 : 0.004), y + s * 0.35, z - (sgnAxis === 'z' ? 0.004 : 0.006)],
          [x + (sgnAxis === 'z' ? 0.006 : 0.004), y - s * 0.35, z + (sgnAxis === 'z' ? 0.004 : 0.006)]], { c: '#384250', w: 2.6, bias: -0.3 });
  }
}

function buildStreetFurniture() {
  // guard rails framing the two crossings
  guardRail(-3.3, 4.3, -0.9, 4.3, 4);
  guardRail(4.3, 1.1, 4.3, 3.15, 3);
  guardRail(6.0, -6.5, 6.0, -5.0, 2);
  // bollards at the sidewalk corners so cars keep away
  for (const [bx, bz] of [[3.6, 2.85], [3.0, 4.3], [4.3, 2.4]]) {
    cyl(bx, 0.34, bz, 0.065, 0.66, 'y', 8, { c: '#8e98a6', ink: 0.7 });
    cyl(bx, 0.68, bz, 0.075, 0.06, 'y', 8, { c: '#c9d3de', ink: 0.5 });
    ring(bx, 0.52, bz, 0.07, 'y', 8, { c: '#f2f5f8', w: 2, al: 0.8 });
  }
  // signage on short poles
  const signs = [[4.28, 3.05, 'stop', 'z', 1, 2.05], [3.35, 4.3, 'cross', 'z', 1, 1.85],
                 [-2.0, 4.32, 'speed', 'z', 1, 2.0], [6.45, 1.4, 'cross', 'z', -1, 1.9]];
  for (const [x, z, kind, ax, sg, hh] of signs) {
    cyl(x, hh / 2, z, 0.045, hh, 'y', 7, { c: '#7d8695', ink: 0.7 });
    plate(x, hh + 0.12, z, kind, ax, sg);
  }
  // red post box down the street + a fire hydrant + a planter
  boxG(-6.5, YWALK, 3.15, -5.95, YWALK + 1.15, 3.7, { c: '#b2413a', ink: 1.0, sides: { t: '#c9503f' } });
  wallZ(3.71, -6.45, -6.0, YWALK + 0.55, YWALK + 0.95, +1, { c: '#25303c', em: 0.2, ink: 0.7 });
  wallZ(3.71, -6.45, -6.0, YWALK + 0.98, YWALK + 1.1, +1, { c: '#e8e2d2', em: 0.35, ink: 0.5 });
  boxG(-6.6, YWALK, 3.05, -5.85, YWALK + 0.12, 3.8, { c: '#8f4a41', ink: 0.8 });
  cyl(-4.0, YWALK + 0.22, 4.05, 0.12, 0.44, 'y', 8, { c: '#c9503f', ink: 0.8 });
  cyl(-4.0, YWALK + 0.46, 4.05, 0.07, 0.1, 'y', 6, { c: '#e0b64a', ink: 0.5 });
  boxG(-6.9, YWALK, -0.6, -6.3, YWALK + 0.42, 0.1, { c: '#5b6a4d', ink: 0.8, sides: { t: '#4e5a44' } });
  for (let i = 0; i < 5; i++) cyl(-6.75 + i * 0.16, YWALK + 0.55, -0.3 + ((i * 7) % 5) * 0.12, 0.05, 0.34, 'y', 5, { c: '#4f7a4e', ink: 0.4 });
  // a couple of sand-filled traffic cones near the shop
  for (const [cx, cz] of [[1.55, 3.9], [-1.2, 3.62]]) {
    cyl(cx, YWALK + 0.2, cz, 0.16, 0.06, 'y', 8, { c: '#3a4250', ink: 0.6 });
    const pts = [];
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; pts.push([cx + Math.cos(a) * 0.12, YWALK + 0.5, cz + Math.sin(a) * 0.12]); }
    for (let i = 0; i < 8; i++) face([pts[i], pts[(i + 1) % 8], [cx, YWALK + 0.62, cz]], { c: '#e2762f', ink: 0 });
    ring(cx, YWALK + 0.4, cz, 0.1, 'y', 8, { c: '#f3f6f9', w: 3, al: 0.9 });
  }
}

/* ---------- the vending machine out front ---------- */
function buildVending(x, z) {
  const y = YWALK, w = 0.86, d = 0.62, h = 1.86;
  boxG(x - w / 2, y, z - d / 2, x + w / 2, y + h, z + d / 2, {
    c: '#1b3f74', ink: 1.1, sides: { t: '#224c86', l: '#16325c', r: '#16325c', k: '#12294c' },
  });
  wallZ(z + d / 2 + 0.01, x - w / 2 + 0.05, x + w / 2 - 0.05, y + 0.14, y + h - 0.12, +1,
    { tex: TEX.vending, uv: [0, 0, 1, 1], c: '#ffffff', em: 0.72, ink: 0.9, inkc: col('#0c1c33') });
  // the light box on top + a cool under-glow
  wallZ(z + d / 2 + 0.012, x - w / 2 + 0.03, x + w / 2 - 0.03, y + h - 0.02, y + h + 0.3, +1,
    { c: '#7fd0ff', em: 0.92, lit: 'none', ink: 0.9, inkc: col('#1b4a6d') });
  boxG(x - w / 2 - 0.04, y + h - 0.04, z - d / 2 - 0.04, x + w / 2 + 0.04, y + h + 0.34, z + d / 2 + 0.03, { c: '#25406b', ink: 0.9 });
  const pulse = () => (T.reduced ? 0.8 : 0.72 + 0.1 * Math.sin(T.t * 1.3) + 0.04 * Math.sin(T.t * 9.3));
  light([x, y + h * 0.75, z + d / 2 + 0.2], '#6cc8ff', 3.6, 0.55, pulse);
  glow([x, YWALK + 0.01, z + d / 2 + 0.35], '#4fbaff', 1.15, 0.5, 'pool+smear', pulse, [x, y + h * 0.6, z + d / 2]);
  glow([x, y + h + 0.16, z + d / 2], '#9fe0ff', 0.75, 0.6, 'halo', pulse);
  // a bottle returned into the tray, and the pickup flap
  boxC(x + 0.18, y + 0.34, z + d / 2 + 0.01, 0.34, 0.24, 0.06, { c: '#0f2544', ink: 0.7 });
  cyl(x + 0.18, y + 0.36, z + d / 2 + 0.05, 0.05, 0.16, 'z', 7, { c: '#d94f8a', ink: 0.5 });
}

/* ---------- bicycles on their rack ---------- */
function bicycle(x, z, rot, opts) {
  opts = opts || {};
  const c = opts.c || '#3f6f9e';
  const rad = 0.31, base = YWALK;
  const cs = Math.cos(rot), sn = Math.sin(rot);
  // local -> world, rotating about y; boxes swap their x/z extents as they turn
  const T2 = (px, py, pz) => [x + px * cs + pz * sn, base + py, z - px * sn + pz * cs];
  const boxR = (px, py, pz, w, h, d, o) => {
    const p = T2(px, py, pz);
    return Math.abs(cs) >= Math.abs(sn) ? boxC(p[0], p[1], p[2], w, h, d, o) : boxC(p[0], p[1], p[2], d, h, w, o);
  };
  for (const wx of [-0.52, 0.52]) {
    ring(...T2(wx, rad, 0), rad, 'x', 14, { c: '#252c36', w: 2.6 });
    ring(...T2(wx, rad, 0), rad * 0.72, 'x', 12, { c: '#8e98a6', w: 1.2, al: 0.75 });
    cyl(...T2(wx, rad, 0), 0.05, 0.09, 'x', 6, { c: '#5d6672', ink: 0.4, caps: false });
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI;
      poly([T2(wx, rad + Math.sin(a) * rad * 0.72, Math.cos(a) * rad * 0.72 * -1), T2(wx, rad - Math.sin(a) * rad * 0.72, Math.cos(a) * rad * 0.72)],
        { c: '#767f8c', w: 0.8, al: 0.5 });
    }
  }
  // frame: down tube, top tube, seat tube, forks, chain stay
  const pts = [[-0.52, rad, 0], [-0.12, 0.62, 0], [0.18, 0.72, 0], [0.52, rad, 0]];
  for (let i = 0; i < pts.length - 1; i++) poly([...T2(...pts[i]), ...T2(...pts[i + 1])], { c: c, w: 3.4, ink: 0.4 });
  poly([...T2(-0.12, 0.62, 0), ...T2(0.05, 0.32, 0)], { c: c, w: 3.2, ink: 0.4 });
  poly([...T2(0.05, 0.32, 0), ...T2(0.52, rad, 0)], { c: c, w: 3, ink: 0.4 });
  poly([...T2(0.18, 0.72, 0), ...T2(0.3, 0.42, 0)], { c: '#5a636f', w: 3, ink: 0.4 });
  poly([...T2(-0.52, rad, 0), ...T2(-0.05, 0.36, 0)], { c: c, w: 2.6, ink: 0.4 });
  // saddle, bars, basket, mudguards, a rain cape
  boxR(0.16, 0.83, 0, 0.24, 0.06, 0.12, { c: '#2a3038', ink: 0.6 });
  poly([...T2(0.3, 0.86, 0), ...T2(0.42, 0.9, 0)], { c: '#3e4653', w: 2.6 });
  boxR(-0.44, 0.66, 0, 0.26, 0.2, 0.24, { c: '#8b8574', ink: 0.8 });
  if (opts.umbrella) {
    poly([...T2(-0.5, 0.5, -0.16), ...T2(-0.36, 1.12, -0.1)], { c: '#c8402f', w: 3 });
    poly([...T2(-0.36, 1.12, -0.1), ...T2(-0.3, 1.16, -0.02)], { c: '#2b3138', w: 2.4 });
  }
  if (opts.cape) {
    const pts2 = [T2(-0.3, 0.86, -0.14), T2(0.42, 0.86, -0.14), T2(0.5, 0.42, 0.16), T2(-0.36, 0.4, 0.16)];
    face(pts2, { c: opts.cape, ink: 0.9, inkc: col('#243a4c'), n: [0, 0.6, -0.8] });
  }
  // the leaning kickstand shadow patch
  gq(x - 0.4, z - 0.28, x + 0.4, z + 0.28, base + 0.008, { c: '#1b2230', al: 0.3, bias: 21, ink: 0 });
}

function buildBikes() {
  // rack: two low rails
  for (const rz of [3.32, 3.62]) {
    poly([[-1.6, YWALK + 0.34, rz], [0.5, YWALK + 0.34, rz]], { c: '#7e8794', w: 3.4, ink: 0.5 });
    for (let x = -1.6; x <= 0.5; x += 0.7) cyl(x, YWALK + 0.17, rz, 0.035, 0.34, 'y', 6, { c: '#6d7683', ink: 0.5 });
  }
  bicycle(-1.25, 3.47, 0.22, { c: '#2f5d8a', umbrella: 1 });
  bicycle(-0.35, 3.47, -0.14, { c: '#8e4a52', cape: '#2f4d63' });
  bicycle(0.42, 3.5, 0.08, { c: '#3f7a58' });
  // one lone bike chained to the alley wall
  bicycle(-3.42, 1.6, 1.57, { c: '#6b6f78', umbrella: 1 });
}

/* ---------- a parked kei car in the pad ---------- */
function buildCar(x, z) {

  boxG(x - 0.6, y + 1.24, z - 1.0, x + 0.6, y + 1.3, z + 1.0, { c: '#8b949f', ink: 0.6 });

function buildProps() {
  buildPolesWires();

  // eave drips: the canopy edges, the roof corners and the AC unit
  for (let x = L.store.x0 + 0.4; x < L.store.x1; x += 0.62) DRIP.push({ x: x, y: 2.72, z: L.store.z1 + 0.78, rate: 0.9 });
  for (let z = L.store.z0 + 0.6; z < L.store.z1; z += 0.7) DRIP.push({ x: L.store.x1 + 0.78, y: 2.72, z: z, rate: 0.8 });
  DRIP.push({ x: L.store.x1 + 0.42, y: 1.86, z: L.store.z0 + 0.9, rate: 2.6 });
  DRIP.push({ x: L.nb.x1 - 0.2, y: 3.4, z: L.nb.z0 + 0.4, rate: 0.6 });
