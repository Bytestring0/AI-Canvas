<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>雨夜便利店街角 · 微缩模型</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a16;}
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  canvas.drag{cursor:grabbing;}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(3,5,14,.64) 100%);}
</style>
</head>
<body>
<div id="app"><canvas id="scene"></canvas></div>
<div class="vignette"></div>
<script>
(function(){
'use strict';
/* ================= utilities ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function rand(a,b){return a+Math.random()*(b-a);}
function vsub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vcross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function vnorm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
function hexRgb(h){
  if(typeof h!=='string'||h.charAt(0)!=='#')return [255,255,255];
  h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function shadeStr(hex,f,a){
  if(typeof hex!=='string'||hex.charAt(0)!=='#')return hex;
  const c=hexRgb(hex);return 'rgba('+Math.round(clamp(c[0]*f,0,255))+','+Math.round(clamp(c[1]*f,0,255))+','+Math.round(clamp(c[2]*f,0,255))+','+(a==null?1:a)+')';}
function avgPts(pts){let x=0,y=0,z=0;for(const p of pts){x+=p[0];y+=p[1];z+=p[2];}const n=pts.length;return [x/n,y/n,z/n];}

/* ================= face system ================= */
const LIGHT=vnorm([0.5,0.72,0.35]);
const OUTLINE='rgba(16,20,40,0.72)';
const FACES=[],DYNAMIC=[],GLOWS=[];
function addFace(pts,color,opts){
  opts=opts||{};
  const p=pts.map(a=>a.slice());
  const n=vnorm(vcross(vsub(p[1],p[0]),vsub(p[2],p[0])));
  const lit=opts.lit!==undefined?opts.lit:(vdot(n,LIGHT)>0.22);
  const face={
    pts:p,n,color,lit,
    alpha:opts.alpha!==undefined?opts.alpha:1,
    emissive:!!opts.emissive,
    glow:opts.glow||0,
    glowColor:opts.glowColor||color,
    glowRGB:opts.glowRGB||hexRgb(opts.glowColor||color),
    glowRadius:opts.glowRadius||1,
    glowFn:opts.glowFn||null,
    cull:opts.cull!==undefined?opts.cull:true,
    noOutline:!!opts.noOutline,
    content:opts.content||null,
    seed:opts.seed!==undefined?opts.seed:1,
    strokeColor:opts.strokeColor||OUTLINE,
    strokeWidth:opts.strokeWidth||1,
    center:avgPts(p),
    sDepth:0,sArea:0,screen:null,drawn:false,
    streaks:opts.streaks||null
  };
  face.cLit=shadeStr(color,opts.bright!==undefined?opts.bright:1.0,face.alpha);
  face.cDark=shadeStr(color,0.6,face.alpha);
  if(face.emissive)face.cLit=face.cDark=shadeStr(color,1,face.alpha);
  FACES.push(face);
  if(opts.glow)GLOWS.push(face);
  return face;
}
function makeDynamic(face,fn){
  face.basePts=face.pts.map(a=>a.slice());
  face.center0=face.center.slice();
  face.dyn=fn;
  DYNAMIC.push(face);
}
function updateDynamics(t){
  for(let i=0;i<DYNAMIC.length;i++){
    const f=DYNAMIC[i],o=f.dyn(t);
    for(let j=0;j<f.pts.length;j++){
      f.pts[j][0]=f.basePts[j][0]+o[0];
      f.pts[j][1]=f.basePts[j][1]+o[1];
      f.pts[j][2]=f.basePts[j][2]+o[2];
    }
    f.n=vnorm(vcross(vsub(f.pts[1],f.pts[0]),vsub(f.pts[2],f.pts[0])));
    f.center=[f.center0[0]+o[0],f.center0[1]+o[1],f.center0[2]+o[2]];
    if(!f.emissive)f.lit=vdot(f.n,LIGHT)>0.22;
  }
}
function transformFaces(faces,tx,ty,tz,ry,rx){
  const cy=Math.cos(ry||0),sy=Math.sin(ry||0);
  const cx=Math.cos(rx||0),sx=Math.sin(rx||0);
  for(const f of faces){
    for(const p of f.pts){
      let x=p[0],y=p[1],z=p[2];
      if(rx){const y2=y*cx-z*sx,z2=y*sx+z*cx;y=y2;z=z2;}
      const x2=x*cy+z*sy,z2=-x*sy+z*cy;
      p[0]=x2+tx;p[1]=y+ty;p[2]=z2+tz;
    }
    f.n=vnorm(vcross(vsub(f.pts[1],f.pts[0]),vsub(f.pts[2],f.pts[0])));
    f.center=avgPts(f.pts);
    if(!f.emissive)f.lit=vdot(f.n,LIGHT)>0.22;
  }
  return faces;
}

/* ================= geometry builders ================= */
function addBoxF(cx,cy,cz,w,h,d,cols,opts){
  opts=opts||{};
  const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,z0=cz-d/2,z1=cz+d/2;
  const C=cols.all||null,out=[];
  const face=(pts,col,o)=>{if(col)out.push(addFace(pts,col,o));};
  face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],cols.pz||C,opts);
  face([[x0,y1,z0],[x1,y1,z0],[x1,y0,z0],[x0,y0,z0]],cols.nz||C,opts);
  face([[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],cols.px||C,opts);
  face([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],cols.nx||C,opts);
  face([[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],cols.py||C,opts);
  face([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],cols.ny||C,opts);
  return out;
}
function addBox(cx,cy,cz,w,h,d,color,opts){return addBoxF(cx,cy,cz,w,h,d,{all:color},opts);}
function addCylY(cx,cz,r,y0,y1,color,opts,seg){
  seg=seg||12;opts=opts||{};
  const faces=[];
  for(let i=0;i<seg;i++){
    const a0=i/seg*TAU,a1=(i+1)/seg*TAU;
    const x0p=cx+Math.cos(a0)*r,z0p=cz+Math.sin(a0)*r;
    const x1p=cx+Math.cos(a1)*r,z1p=cz+Math.sin(a1)*r;
    faces.push(addFace([[x0p,y0,z0p],[x0p,y1,z0p],[x1p,y1,z1p],[x1p,y0,z1p]],color,opts));
  }
  const top=[[cx,y1,cz]];
  for(let i=seg;i>=0;i--){const a=i/seg*TAU;top.push([cx+Math.cos(a)*r,y1,cz+Math.sin(a)*r]);}
  faces.push(addFace(top,color,opts));
  const bot=[[cx,y0,cz]];
  for(let i=0;i<=seg;i++){const a=i/seg*TAU;bot.push([cx+Math.cos(a)*r,y0,cz+Math.sin(a)*r]);}
  faces.push(addFace(bot,color,opts));
  return faces;
}
function addCylX(cx,cy,cz,r,w,color,opts,seg){
  seg=seg||10;opts=opts||{};
  const x0=cx-w/2,x1=cx+w/2,faces=[];
  for(let i=0;i<seg;i++){
    const a0=i/seg*TAU,a1=(i+1)/seg*TAU;
    const y0p=cy+Math.cos(a0)*r,z0p=cz+Math.sin(a0)*r;
    const y1p=cy+Math.cos(a1)*r,z1p=cz+Math.sin(a1)*r;
    faces.push(addFace([[x0,y0p,z0p],[x0,y1p,z1p],[x1,y1p,z1p],[x1,y0p,z0p]],color,opts));
  }
  const d0=[[x0,cy,cz]];
  for(let i=seg;i>=0;i--){const a=i/seg*TAU;d0.push([x0,cy+Math.cos(a)*r,cz+Math.sin(a)*r]);}
  faces.push(addFace(d0,color,opts));
  const d1=[[x1,cy,cz]];
  for(let i=0;i<=seg;i++){const a=i/seg*TAU;d1.push([x1,cy+Math.cos(a)*r,cz+Math.sin(a)*r]);}
  faces.push(addFace(d1,color,opts));
  return faces;
}
function addGroundTiles(x0,z0,x1,z1,y,color,opts,step){
  step=step||2;opts=opts||{};
  for(let gx=x0;gx<x1;gx+=step){
    for(let gz=z0;gz<z1;gz+=step){
      const ax=Math.min(gx+step,x1),az=Math.min(gz+step,z1);
      const o=Object.assign({},opts);
      if(opts.jitter)o.bright=0.9+Math.random()*0.2;
      addFace([[gx,y,gz],[gx,y,az],[ax,y,az],[ax,y,gz]],color,o);
    }
  }
}

/* ================= content drawing ================= */
function drawFaceContent(ctx,face,spts,t){
  const c=face.content;if(!c)return;
  const p0=spts[0],p1=spts[1];
  const p2=spts.length>=4?spts[3]:spts[2];
  const ax=p1[0]-p0[0],ay=p1[1]-p0[1],bx=p2[0]-p0[0],by=p2[1]-p0[1];
  const det=ax*by-ay*bx;
  if(Math.abs(det)<6)return;
  const w0=face.pts[0],w1=face.pts[1],w3=face.pts.length>=4?face.pts[3]:face.pts[2];
  const wU=Math.hypot(w1[0]-w0[0],w1[1]-w0[1],w1[2]-w0[2]);
  const wV=Math.hypot(w3[0]-w0[0],w3[1]-w0[1],w3[2]-w0[2]);
  if(wV<1e-6)return;
  const Umax=100*(wU/wV);
  const scaleU=Math.hypot(ax,ay),scaleV=Math.hypot(bx,by);
  ctx.save();
  ctx.beginPath();ctx.moveTo(p0[0],p0[1]);
  for(let i=1;i<spts.length;i++)ctx.lineTo(spts[i][0],spts[i][1]);
  ctx.closePath();ctx.clip();
  ctx.transform(ax/Umax,ay/Umax,bx/100,by/100,p0[0],p0[1]);
  c(ctx,face,t,{px:Umax/scaleU,py:100/scaleV,scaleU:scaleU,scaleV:scaleV,w:Umax,h:100});
  ctx.restore();
}
function shelfContent(ctx,f,t,info){
  const W=info.w;
  let s=f.seed;
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const cols=['#e74c3c','#3498db','#f1c40f','#2ecc71','#e67e22','#9b59b6','#ff6b81','#54a0ff','#f8a5c2','#f5cd79','#63cdda','#cf6a87','#ff9ff3','#48dbfb'];
  let x=0;
  while(x<W-2){
    const w=4+rnd()*8,h=45+rnd()*40;
    ctx.fillStyle=cols[(s|0)%cols.length];
    ctx.fillRect(x,100-h,w,h);
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.fillRect(x+0.8,100-h+2,1.2,h*0.28);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.fillRect(x,100-h,w,1.5);
    x+=w+1.2;
  }
  ctx.fillStyle='#e8ecf4';ctx.fillRect(0,0,W,3);
}
function drinkCoolerContent(ctx,f,t,info){
  const W=info.w;
  const g=ctx.createLinearGradient(0,0,0,100);
  g.addColorStop(0,'#eaf8ff');g.addColorStop(1,'#bfe4ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,100);
  let s=f.seed;
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const cols=['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#e84393','#00cec9','#fdcb6e'];
  for(let row=0;row<5;row++){
    let x=2;
    while(x<W-4){
      const w=7+rnd()*5,h=10+rnd()*6;
      const col=cols[(s|0)%cols.length];
      ctx.fillStyle=col;
      ctx.fillRect(x,8+row*18,w,h);
      ctx.fillStyle='#fff';ctx.fillRect(x+1,8+row*18,w*0.3,2);
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.fillRect(x+w*0.2,8+row*18-2,w*0.6,2);
      x+=w+1.5;
    }
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(0,8+row*18+12,W,1);
  }
  ctx.fillStyle='rgba(0,40,80,0.15)';ctx.fillRect(0,0,W,4);
}
function posterContent(bg,accent,txt){
  return function(ctx,f,t,info){
    const W=info.w;
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,100);
    ctx.fillStyle=accent;
    ctx.beginPath();ctx.arc(W/2,38,26,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 20px "Microsoft YaHei","Arial",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(txt,W/2,50);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.font='bold 8px "Microsoft YaHei",sans-serif';
    ctx.fillText('★ 新発売 ★',W/2,78);
    ctx.fillStyle=accent;ctx.fillRect(0,88,W,12);
  };
}
function storeSignContent(ctx,f,t,info){
  const W=info.w,b=signFlicker(t);
  const g=ctx.createLinearGradient(0,0,0,100);
  g.addColorStop(0,'rgba(255,246,220,'+(0.9*b)+')');
  g.addColorStop(0.5,'rgba(255,255,255,'+b+')');
  g.addColorStop(1,'rgba(255,236,200,'+(0.9*b)+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,100);
  ctx.fillStyle='#e8453a';ctx.fillRect(0,86,W,14);
  ctx.fillStyle='#e8453a';ctx.beginPath();ctx.arc(W*0.07,24,12,0,TAU);ctx.fill();
  ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(W*0.07+3,21,5.5,0,TAU);ctx.fill();
  ctx.fillStyle='#1a2a55';
  ctx.font='bold 55px "Arial Black","Arial",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('SUNNY MART',W*0.54,32);
  ctx.fillStyle='#e8453a';
  ctx.font='bold 24px "Microsoft YaHei","Arial",sans-serif';
  ctx.fillText('サニーマート',W*0.54,60);
  ctx.fillStyle='#2a6db0';ctx.beginPath();ctx.arc(W*0.94,15,12,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 7px Arial,sans-serif';ctx.fillText('24H',W*0.94,16);
  ctx.fillStyle='#2a6db0';ctx.fillRect(0,0,W,3);
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fillRect(0,0,3,86);
}
function glassStreaks(ctx,f,t,info){
  const W=info.w;
  const g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'rgba(255,255,255,0.14)');
  g.addColorStop(0.35,'rgba(255,255,255,0.02)');
  g.addColorStop(0.85,'rgba(190,225,255,0.08)');
  g.addColorStop(1,'rgba(170,215,255,0.14)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,100);
  if(!f.streaks)return;
  ctx.lineCap='round';
  for(const s of f.streaks){
    const len=s.len*55;
    const span=105+len;
    const v=(((s.v*100-t*s.speed*18)%span)+span)%span-5-len;
    if(v>102||v+len<0)continue;
    ctx.strokeStyle='rgba(205,230,255,'+(0.3*s.w)+')';
    ctx.lineWidth=Math.max(0.8,info.px*0.05*s.w);
    ctx.beginPath();ctx.moveTo(s.u*W,v);
    ctx.lineTo(s.u*W+info.px*0.8,v+len);
    ctx.stroke();
    ctx.fillStyle='rgba(215,235,255,'+(0.34*s.w)+')';
    ctx.beginPath();ctx.arc(s.u*W+info.px*0.8,v+len,Math.max(0.6,info.px*0.09*s.w),0,TAU);ctx.fill();
  }
}

/* ================= animation state ================= */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function signFlicker(t){
  if(REDUCED)return 1;
  const cyc=t%6.7;
  if(cyc>6.15&&cyc<6.35)return 0.4+0.6*Math.random();
  if(cyc>6.35&&cyc<6.5)return 0.75+0.25*Math.random();
  return 1;
}
const door={open:0};
function updateDoor(t){
  if(REDUCED){door.open=0;return;}
  const cyc=t%14;
  let d=0;
  if(cyc<2)d=cyc/1.6;
  else if(cyc<6.5)d=1;
  else if(cyc<8)d=1-(cyc-6.5)/1.6;
  door.open=clamp(d,0,1);
}
const tl={active:'r'};
function updateTraffic(t){
  if(REDUCED){tl.active='r';return;}
  const ph=t%12;
  tl.active=ph<6?'r':(ph<7.5?'y':'g');
}
function setLamp(face,on,color){
  if(on){
    face.emissive=true;
    face.cLit=face.cDark=shadeStr(color,1,face.alpha);
    face.glowOn=true;
  }else{
    face.emissive=false;
    face.cLit=face.cDark=shadeStr('#1c2028',1,face.alpha);
    face.glowOn=false;
  }
}

/* ================= rain / drops / ripples ================= */
const RAIN=[],SPLASHES=[],RIPPLES=[],DROPS=[],DRIP_SOURCES=[];
const REFLECT_SOURCES=[],SPILLS=[];
function initRain(){
  const n=REDUCED?0:230;
  for(let i=0;i<n;i++){
    RAIN.push({x:rand(-14,14),y:rand(0,12),z:rand(-14,14),sp:rand(8,12),a:rand(0.22,0.55),w:rand(0.7,1.4)});
  }
}
function insideSolid(x,y,z){
  if(x>-4.2&&x<2.0&&z>-6.4&&z<-1.2&&y<3.0)return true;
  if(x>-6.6&&x<-6.2&&z>-7&&z<-1.2&&y<5.0)return true;
  if(x>6.4&&x<7&&z>-3&&z<5&&y<4.2)return true;
  return false;
}
function isWet(x,z){
  if(z>0.6&&z<7)return true;
  if(x>3.4&&x<7&&z>-7&&z<7)return true;
  return false;
}
function updateRain(t,dt){
  if(REDUCED)return;
  for(let i=0;i<RAIN.length;i++){
    const r=RAIN[i];
    r.y-=r.sp*dt;r.x-=1.4*dt;r.z+=0.35*dt;
    if(r.y<0){
      r.y=rand(9.5,12);r.x=rand(-14,14);r.z=rand(-14,14);
      SPLASHES.push({x:r.x,z:r.z,life:0.28});
      if(isWet(r.x,r.z)&&Math.random()<0.3)RIPPLES.push({x:r.x,z:r.z,rad:0,max:rand(0.2,0.5),life:1.1});
    }
  }
  for(let i=SPLASHES.length-1;i>=0;i--){
    const s=SPLASHES[i];s.life-=dt;
    if(s.life<=0)SPLASHES.splice(i,1);
  }
  for(let i=RIPPLES.length-1;i>=0;i--){
    const r=RIPPLES[i];r.life-=dt*0.8;r.rad+=(r.max-r.rad)*dt*3;
    if(r.life<=0)RIPPLES.splice(i,1);
  }
  for(let i=DROPS.length-1;i>=0;i--){
    const d=DROPS[i];
    d.vy-=9*dt;d.y+=d.vy*dt;d.x+=d.vx*dt;d.z+=d.vz*dt;d.life-=dt;
    if(d.y<=0||d.life<=0){
      if(d.y<=0)SPLASHES.push({x:d.x,z:d.z,life:0.2});
      DROPS.splice(i,1);
    }
  }
  if(DRIP_SOURCES.length&&Math.random()<0.5&&DROPS.length<80){
    const src=DRIP_SOURCES[(Math.random()*DRIP_SOURCES.length)|0];
    DROPS.push({x:src[0]+rand(-0.03,0.03),y:src[1],z:src[2]+rand(-0.03,0.03),vx:rand(-0.2,0.2),vy:0,vz:rand(-0.1,0.1),life:1.2});
  }
}

/* ================= camera ================= */
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.75);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
resize();
const cam={yaw:0.66,pitch:0.45,dist:19.5,target:[0.4,1.0,1.0]};
if(window.innerWidth<600)cam.dist=27;
function cameraBasis(){
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const eye=[cam.target[0]+cam.dist*Math.sin(cam.yaw)*cp,
             cam.target[1]+cam.dist*sp,
             cam.target[2]+cam.dist*Math.cos(cam.yaw)*cp];
  const fwd=vnorm(vsub(cam.target,eye));
  const right=vnorm(vcross(fwd,[0,1,0]));
  const up=vcross(right,fwd);
  return {eye,fwd,right,up};
}
const FOV=40*Math.PI/180;
let f=(H*0.5)/Math.tan(FOV/2);
function projectPoint(p,cb){
  const dx=p[0]-cb.eye[0],dy=p[1]-cb.eye[1],dz=p[2]-cb.eye[2];
  const cz=dx*cb.fwd[0]+dy*cb.fwd[1]+dz*cb.fwd[2];
  if(cz<0.2)return null;
  const cx=dx*cb.right[0]+dy*cb.right[1]+dz*cb.right[2];
  const cyy=dx*cb.up[0]+dy*cb.up[1]+dz*cb.up[2];
  return [W/2+(cx/cz)*f,H/2-(cyy/cz)*f];
}

/* ================= input ================= */
let pointers=new Map();
let pinchDist=0,pinchStart=null,rotStart=null,panStart=null;
function onDown(e){
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.button===2||e.shiftKey){
    panStart={x:e.clientX,y:e.clientY,target:cam.target.slice()};
  }else if(pointers.size===1){
    rotStart={x:e.clientX,y:e.clientY,yaw:cam.yaw,pitch:cam.pitch};
  }else if(pointers.size===2){
    const p=[...pointers.values()];
    pinchDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    pinchStart={dist:cam.dist};
    rotStart=null;
  }
  canvas.classList.add('drag');
  e.preventDefault();
}
function onMove(e){
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchStart)cam.dist=clamp(pinchStart.dist*(pinchDist/d),9.5,34);
    return;
  }
  const cur=pointers.get(e.pointerId);
  const dx=e.clientX-cur.x,dy=e.clientY-cur.y;
  if(panStart){
    const cb=cameraBasis();
    const scale=cam.dist*Math.tan(FOV/2)*2/H;
    const mx=-dx*scale,my=dy*scale;
    cam.target[0]=panStart.target[0]+cb.right[0]*mx+cb.up[0]*my;
    cam.target[1]=panStart.target[1]+cb.right[1]*mx+cb.up[1]*my;
    cam.target[2]=panStart.target[2]+cb.right[2]*mx+cb.up[2]*my;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  }else if(rotStart){
    cam.yaw=rotStart.yaw-dx*0.008;
    cam.pitch=clamp(rotStart.pitch+dy*0.008,0.08,1.32);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  }
}
function onUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchStart=null;
  if(pointers.size===0){rotStart=null;panStart=null;canvas.classList.remove('drag');}
}
canvas.addEventListener('pointerdown',onDown);
canvas.addEventListener('pointermove',onMove);
canvas.addEventListener('pointerup',onUp);
canvas.addEventListener('pointercancel',onUp);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.dist=clamp(cam.dist*Math.exp(e.deltaY*0.0012),9.5,34);
},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  const step=e.shiftKey?0.5:0.08;
  if(e.key==='ArrowLeft'){cam.yaw-=step;e.preventDefault();}
  else if(e.key==='ArrowRight'){cam.yaw+=step;e.preventDefault();}
  else if(e.key==='ArrowUp'){cam.pitch=clamp(cam.pitch+step,0.08,1.32);e.preventDefault();}
  else if(e.key==='ArrowDown'){cam.pitch=clamp(cam.pitch-step,0.08,1.32);e.preventDefault();}
  else if(e.key==='+'||e.key==='='){cam.dist=clamp(cam.dist*0.92,9.5,34);e.preventDefault();}
  else if(e.key==='-'||e.key==='_'){cam.dist=clamp(cam.dist*1.08,9.5,34);e.preventDefault();}
  else if(e.key==='r'||e.key==='R'){cam.yaw=0.66;cam.pitch=0.45;cam.dist=19.5;cam.target=[0.4,1.0,1.0];}
});

function vendingContent(ctx,f,t,info){
  const W=info.w;
  const g=ctx.createLinearGradient(0,0,0,60);
  g.addColorStop(0,'#dff2ff');g.addColorStop(1,'#a8d8ff');
  ctx.fillStyle=g;ctx.fillRect(W*0.06,5,W*0.88,52);
  let s=f.seed;
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const cols=['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#e84393'];
  for(let row=0;row<3;row++){
    let x=W*0.08;
    while(x<W*0.92){
      const w=(8+rnd()*6)*(W/55);
      ctx.fillStyle=cols[(s|0)%cols.length];
      ctx.fillRect(x,8+row*17,w,13);
      x+=w+2*(W/55);
    }
  }
  for(let r=0;r<4;r++){
    for(let c=0;c<6;c++){
      ctx.fillStyle=cols[(r*6+c+s)%cols.length];
      ctx.beginPath();ctx.arc(W*(0.12+c*0.15),76+r*5,2.2,0,TAU);ctx.fill();
    }
  }
  ctx.fillStyle='#8ec8ff';ctx.font='bold 6px "Microsoft YaHei",Arial';ctx.textAlign='center';ctx.fillText('自動販売機',W/2,72);
  ctx.fillStyle='#0a0e14';ctx.fillRect(W*0.35,96,W*0.3,4);
}

function addWire(p0,p1,color){
  const mid=[(p0[0]+p1[0])/2,Math.min(p0[1],p1[1])-0.8,(p0[2]+p1[2])/2];
  const segs=16,pts=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    pts.push([(1-t)*(1-t)*p0[0]+2*(1-t)*t*mid[0]+t*t*p1[0],
              (1-t)*(1-t)*p0[1]+2*(1-t)*t*mid[1]+t*t*p1[1],
              (1-t)*(1-t)*p0[2]+2*(1-t)*t*mid[2]+t*t*p1[2]]);
  }
  for(let i=0;i<segs;i++){
    const a=pts[i],b=pts[i+1];
    const dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2];
    const len=Math.hypot(dx,dy,dz)||1;
    const nx=-dz/len,nz=dx/len,w=0.012;
    addFace([[a[0]+nx*w,a[1],a[2]+nz*w],[b[0]+nx*w,b[1],b[2]+nz*w],[b[0]-nx*w,b[1],b[2]-nz*w],[a[0]-nx*w,a[1],a[2]-nz*w]],color,{cull:false,noOutline:true});
  }
}

function addGuardrail(x0,z0,x1,z1){

  const n=Math.max(2,Math.round(len/0.8));
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    addCylY(x0+(x1-x0)*t,z0+(z1-z0)*t,0.03,0,0.6,'#8a90a0',{noOutline:true},6);
  }
  const ang=Math.atan2(x1-x0,z1-z0);
  for(const h of [0.35,0.55]){
    const rail=addBox(0,h,0,len,0.04,0.04,'#aab0c0',{noOutline:true});
    transformFaces(rail,(x0+x1)/2,h,(z0+z1)/2,ang,0);
  }
}
function addStreetSign(x,z,ry){
  const faces=[];
  faces.push(...addCylY(0,0,0.04,0,2.2,'#3a4050',{noOutline:true},6));
  faces.push(...addBox(0,1.9,0.02,0.5,0.35,0.04,'#2a6db0',{noOutline:true,content:function(ctx){
    ctx.fillStyle='#2a6db0';ctx.fillRect(0,0,100,100);
    ctx.fillStyle='#fff';ctx.font='bold 10px "Microsoft YaHei",Arial';ctx.textAlign='center';
    ctx.fillText('中央町',50,42);
    ctx.fillText('3-4',50,66);
  }}));
  transformFaces(faces,x,0,z,ry,0);
}
function addStopSign(x,z,ry){
  const faces=[];
  faces.push(...addCylY(0,0,0.03,0,1.6,'#3a4050',{noOutline:true},6));
  const oct=[];
  for(let i=0;i<8;i++){const a=i/8*TAU+Math.PI/8;oct.push([Math.cos(a)*0.16,1.6,Math.sin(a)*0.16]);}
  faces.push(addFace(oct,'#c0392b',{noOutline:true}));
  transformFaces(faces,x,0,z,ry,0);
}
function addFence(x0,z0,x1,z1,h){
  const len=Math.hypot(x1-x0,z1-z0)||1;
  const n=Math.max(2,Math.round(len/1.2));
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    addCylY(x0+(x1-x0)*t,z0+(z1-z0)*t,0.03,0,h,'#4a5064',{noOutline:true},6);
  }
  const ang=Math.atan2(x1-x0,z1-z0);
  for(const hh of [h*0.5,h*0.85]){
    const rail=addBox(0,hh,0,len,0.03,0.03,'#4a5064',{noOutline:true});
    transformFaces(rail,(x0+x1)/2,hh,(z0+z1)/2,ang,0);
  }
}
function addAlleyDetails(){
  /* back door on store west wall */
  addBox(-4.22,1.0,-3.5,0.05,1.8,0.8,'#6a7080',{noOutline:true});
  addBox(-4.24,1.1,-3.5,0.02,0.3,0.3,'#cfe4ff',{noOutline:true});
  /* alley light */
  addBox(-6.2,2.6,-4.0,0.05,0.2,0.2,'#ffd98c',{emissive:true,glow:0.4,glowColor:'#ffd98c',glowRGB:[255,217,140],noOutline:true});
  /* trash cans */
  addCylY(-5.2,-4.5,0.18,0,0.45,'#4a5064',{noOutline:true},8);
  addCylY(-5.2,-3.5,0.15,0,0.4,'#5a6074',{noOutline:true},8);
}
function addACUnit(){
  /* on store east wall */
  addBox(2.04,1.2,-3.0,0.3,0.55,0.7,'#c8ccd8',{noOutline:true});
  addBox(2.06,1.25,-3.0,0.05,0.2,0.5,'#2f3444',{noOutline:true});
  /* roof unit */
  addBox(-1.0,3.1,-4.2,0.8,0.5,0.6,'#c8ccd8',{noOutline:true});
  addBox(-1.0,3.3,-4.2,0.4,0.15,0.4,'#2f3444',{noOutline:true});
}

/* ================= build scene ================= */
function buildScene(){
  buildBase();
  buildGround();
  buildWestBuilding();
  buildEastBuilding();
  buildStoreShell();
  buildCanopy();
  buildGlass();
  buildDoor();
  buildInterior();

  /* bicycle near pole */

  /* umbrella stand & trash & bulletin board near door */

  /* utility pole & lamps */

  addStopSign(3.3,0.7,Math.PI*0.5);
  /* fence behind store */
  addFence(-4.2,-6.85,2.0,-6.85,1.0);
  /* shadows under storefront objects */
  addShadow(-1.1,0.03,0.2,3.4,1.2,0.22);
}
buildScene();
initRain();

/* ================= background ================= */
const BOKEH=[];
(function(){
  for(let i=0;i<46;i++){
    const warm=Math.random()<0.3;
    BOKEH.push({
      x:Math.random(),y:Math.random()*0.75,
      r:rand(3,16),a:rand(0.04,0.14),sp:rand(0.3,1.2),ph:rand(0,TAU),
      col:warm?[255,190,130]:[140,170,255]
    });
  }
})();
function drawBackground(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a1024');
  g.addColorStop(0.6,'#141c36');
  g.addColorStop(1,'#1b2544');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const mx=W*0.78,my=H*0.2;
  const mg=ctx.createRadialGradient(mx,my,0,mx,my,90);
  mg.addColorStop(0,'rgba(230,238,255,0.65)');
  mg.addColorStop(0.18,'rgba(230,238,255,0.25)');
  mg.addColorStop(1,'rgba(230,238,255,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,90,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(235,242,255,0.82)';
  ctx.beginPath();ctx.arc(mx,my,26,0,TAU);ctx.fill();
  for(const b of BOKEH){
    const a=REDUCED?b.a:(b.a*(0.6+0.4*Math.sin(t*b.sp+b.ph)));
    const bg=ctx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,b.r);
    bg.addColorStop(0,'rgba('+b.col[0]+','+b.col[1]+','+b.col[2]+','+a+')');
    bg.addColorStop(1,'rgba('+b.col[0]+','+b.col[1]+','+b.col[2]+',0)');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(b.x*W,b.y*H,b.r,0,TAU);ctx.fill();
  }
}

/* ================= drawing ================= */
function drawFace(face,t){
  const spts=face.screen;
  ctx.beginPath();
  ctx.moveTo(spts[0][0],spts[0][1]);
  for(let i=1;i<spts.length;i++)ctx.lineTo(spts[i][0],spts[i][1]);
  ctx.closePath();
  const fill=face.emissive?face.cLit:(face.lit?face.cLit:face.cDark);
  ctx.globalAlpha=face.alpha;
  ctx.fillStyle=fill;
  ctx.fill();
  if(!face.noOutline&&face.sArea>10){
    ctx.strokeStyle=face.strokeColor;
    ctx.lineWidth=face.strokeWidth;
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(face.content)drawFaceContent(ctx,face,spts,t);
  face.drawn=true;
}
function updateSpills(){
  for(const s of SPILLS){
    s.alpha=0.18*door.open;
    s.cLit=s.cDark=shadeStr('#ffd9a0',1,s.alpha);
  }
}
function drawGlows(cb){
  ctx.globalCompositeOperation='lighter';
  for(const f of GLOWS){
    if(!f.drawn)continue;
    const p=projectPoint(f.center,cb);
    if(!p)continue;
    let a=f.glow;
    if(f.glowFn)a*=f.glowFn(time);
    if(a<=0.01)continue;
    const dist=Math.hypot(f.center[0]-cb.eye[0],f.center[1]-cb.eye[1],f.center[2]-cb.eye[2]);
    const rad=clamp(520/dist*f.glowRadius,4,110);
    const grd=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],rad);
    grd.addColorStop(0,'rgba('+f.glowRGB[0]+','+f.glowRGB[1]+','+f.glowRGB[2]+','+(a*0.5)+')');
    grd.addColorStop(1,'rgba('+f.glowRGB[0]+','+f.glowRGB[1]+','+f.glowRGB[2]+',0)');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(p[0],p[1],rad,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}
function drawRipples(cb){
  if(REDUCED)return;
  ctx.globalCompositeOperation='lighter';
  for(const r of RIPPLES){
    const a=clamp(r.life,0,1)*0.35;
    if(a<=0.01)continue;
    const c=projectPoint([r.x,0.03,r.z],cb);
    if(!c)continue;
    const rxP=projectPoint([r.x+r.rad,0.03,r.z],cb);
    const rzP=projectPoint([r.x,0.03,r.z+r.rad],cb);
    if(!rxP||!rzP)continue;
    const rx=Math.hypot(rxP[0]-c[0],rxP[1]-c[1]);
    const rz=Math.hypot(rzP[0]-c[0],rzP[1]-c[1]);
    ctx.strokeStyle='rgba(190,215,255,'+a+')';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(c[0],c[1],rx,rz,0,0,TAU);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
}
function drawReflections(cb){
  ctx.globalCompositeOperation='lighter';
  for(const s of REFLECT_SOURCES){
    const gp=projectPoint([s.x,0.035,s.z],cb);
    if(!gp)continue;
    const d=Math.hypot(s.x-cb.eye[0],s.z-cb.eye[2]);
    const len=clamp(650/d*1.2,8,90);
    const wid=clamp(260/d*s.size,2,42);
    const a=s.strength*clamp(1.8-d/28,0.15,1);
    const g=ctx.createLinearGradient(gp[0],gp[1],gp[0],gp[1]+len);
    g.addColorStop(0,'rgba('+s.color[0]+','+s.color[1]+','+s.color[2]+','+(a*0.5)+')');
    g.addColorStop(1,'rgba('+s.color[0]+','+s.color[1]+','+s.color[2]+',0)');
    ctx.fillStyle=g;
    ctx.fillRect(gp[0]-wid/2,gp[1],wid,len);
  }
  const sp=projectPoint([-1.1,0.035,-0.6],cb);
  if(sp){
    const d=Math.hypot(-1.1-cb.eye[0],-0.6-cb.eye[2]);
    const len=clamp(700/d*2.2,12,130);
    const wid=clamp(500/d*3.0,30,160);
    const a=clamp(0.22*(1.6-d/26),0.05,0.28);
    const g=ctx.createLinearGradient(sp[0],sp[1],sp[0],sp[1]+len);
    g.addColorStop(0,'rgba(255,214,150,'+a+')');
    g.addColorStop(1,'rgba(255,214,150,0)');
    ctx.fillStyle=g;
    ctx.fillRect(sp[0]-wid/2,sp[1],wid,len);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawSplashes(cb){
  if(REDUCED)return;
  ctx.strokeStyle='rgba(190,215,255,0.45)';
  for(const s of SPLASHES){
    const p1=projectPoint([s.x,0.02,s.z],cb);
    const p2=projectPoint([s.x,0.08,s.z],cb);
    if(!p1||!p2)continue;
    ctx.globalAlpha=clamp(s.life/0.28,0,1)*0.6;
    ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawRain(cb){
  if(REDUCED)return;
  ctx.lineCap='round';
  for(const r of RAIN){
    if(insideSolid(r.x,r.y,r.z))continue;
    const p1=projectPoint([r.x,r.y,r.z],cb);
    const p2=projectPoint([r.x,r.y-r.sp*0.05,r.z],cb);
    if(!p1||!p2)continue;
    const d=Math.hypot(r.x-cb.eye[0],r.y-cb.eye[1],r.z-cb.eye[2]);
    const a=r.a*clamp(1.4-d/26,0.25,1.1);
    ctx.strokeStyle='rgba(168,198,255,'+a+')';
    ctx.lineWidth=r.w;
    ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();
  }
}
function drawDrops(cb){
  if(REDUCED)return;
  ctx.lineCap='round';
  for(const d of DROPS){
    const p1=projectPoint([d.x,d.y,d.z],cb);
    const p2=projectPoint([d.x,d.y+0.1,d.z],cb);
    if(!p1||!p2)continue;
    ctx.strokeStyle='rgba(200,225,255,'+(clamp(d.life,0,1)*0.5)+')';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();
  }
}

/* ================= main loop ================= */
let time=0,lastT=performance.now();
const DL=[];
function render(t){
  const dt=Math.min(0.05,(t-lastT)/1000||0.016);
  lastT=t;
  time=t/1000;
  updateDynamics(time);
  updateDoor(time);
  updateTraffic(time);
  updateRain(time,dt);
  updateSpills();
  setLamp(tl.red,tl.active==='r','#ff5a5a');
  setLamp(tl.yellow,tl.active==='y','#ffd166');
  setLamp(tl.green,tl.active==='g','#5aff8a');
  f=(H*0.5)/Math.tan(FOV/2);
  const cb=cameraBasis();
  drawBackground(time);
  for(const g of GLOWS)g.drawn=false;
  DL.length=0;
  for(let fi=0;fi<FACES.length;fi++){
    const face=FACES[fi];
    const spts=face.screen||(face.screen=new Array(face.pts.length));
    let ok=true,sumZ=0,minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(let i=0;i<face.pts.length;i++){
      const p=face.pts[i];
      const dx=p[0]-cb.eye[0],dy=p[1]-cb.eye[1],dz=p[2]-cb.eye[2];
      const cz=dx*cb.fwd[0]+dy*cb.fwd[1]+dz*cb.fwd[2];
      if(cz<0.25){ok=false;break;}
      const cx=dx*cb.right[0]+dy*cb.right[1]+dz*cb.right[2];
      const cyy=dx*cb.up[0]+dy*cb.up[1]+dz*cb.up[2];
      const sx=W/2+(cx/cz)*f,sy=H/2-(cyy/cz)*f;
      spts[i]=[sx,sy];
      sumZ+=cz;
      if(sx<minX)minX=sx;if(sx>maxX)maxX=sx;
      if(sy<minY)minY=sy;if(sy>maxY)maxY=sy;
    }
    if(!ok)continue;
    if(face.cull){
      const fc=face.center;
      const vx=cb.eye[0]-fc[0],vy=cb.eye[1]-fc[1],vz=cb.eye[2]-fc[2];
      if(vdot(face.n,[vx,vy,vz])<=0)continue;
    }
    face.sDepth=sumZ/face.pts.length;
    face.sArea=(maxX-minX)*(maxY-minY);
    DL.push(face);
  }
  DL.sort((a,b)=>a.sDepth-b.sDepth);
  for(let i=0;i<DL.length;i++)drawFace(DL[i],time);
  drawGlows(cb);
  drawRipples(cb);
  drawReflections(cb);
  drawSplashes(cb);
  drawRain(cb);
  drawDrops(cb);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
