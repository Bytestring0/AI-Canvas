    <script>

            const random = rand(20261017), between = (a, b) => a + (b - a) * random();

            function flat(x, y, z, w, d, color, alpha = 1) {

                box(1.96, -1.18, 2.15, .17, .77, .87, '#e5e3d1');
                panelSide(2.14, -1.13, -.47, 2.29, 2.85, '#467f8c');
                sticker(V(2.152, -.49, 2.83), V(2.152, -1.10, 2.83), V(2.152, -.49, 2.35), '24H', { color: '#fff1c7', size: 27, bold: true });
                // Exterior objects on the same base.
                vending(-3.57, -3.23);
                // Two trash bins (at the entrance) + umbrella rack.
                for (let i = 0; i < 2; i++) {
                    box(-1.92 + i * .39, -2.88, .27, .29, .32, .66, i ? '#638d96' : '#708f88');
                    box(-1.94 + i * .39, -2.90, .87, .33, .36, .08, '#bfc6b7');

                panelSide(2.006, 1.29, 2.04, 1.12, 2.10, '#efddc6');
                sticker(V(2.016, 1.99, 2.03), V(2.016, 1.33, 2.03), V(2.016, 1.99, 1.31), '秋の新商品', { color: '#6f5966', size: 23, bold: true });
                for (let i = 0; i < 3; i++)line([V(2.018, 1.39, 1.28 + i * .085), V(2.018, 1.95, 1.28 + i * .085)], '#a3a39b', 1);

                box(1.90, 2.12, 1.03, .52, .59, .66, '#b4c7c9');
                for (let k = 0; k < 5; k++)line([V(2.438, 2.18, 1.15 + k * .09), V(2.438, 2.61, 1.15 + k * .09)], '#607b87', 1.7);

                flat(2.53, 2.91, .22, 2.24, 1.84, '#303e51');
                for (let j = 0; j < 6; j++)flat(2.62, 3.13 + j * .255, .225, 1.93, .025, '#697888', .12);
                box(2.39, 3.12, .27, .31, 1.56, .69, '#394b5d');
                for (let j = 0; j < 3; j++)box(2.37, 3.28 + j * .42, .97, .34, .07, .095, '#8b9a94');
                // Bike and parking stand. The bike is genuine projected 3D geometry.
                bicycle(2.08, -1.70);
                rod(V(2.23, -1.78, .31), V(2.23, -1.78, 1.17), '#a9babb', 3);
                box(2.52, -.25, .23, .32, .47, .08, '#b4bdb8');
                sticker(V(2.57, -.30, .315), V(2.81, -.30, .315), V(2.57, .14, .315), 'P', { color: '#78b2c5', size: 28, bold: true });
                // Corner guardrails.
                for (let y of [-1.25, .25, 1.75]) {

                }
                for (let z of [.73, 1.14]) line([V(2.55, -1.25, z), V(2.55, .25, z), V(2.55, 1.75, z)], '#d1ddda', 3.6);
                // Roadside streetlamp, insulator and overhead electric wires.
                pole(4.17, -2.12, 4.72, '#637989');
                rod(V(4.17, -2.12, 5.0), V(3.43, -2.12, 5.04), '#8fa2a9', 5);
                box(3.18, -2.26, 4.89, .39, .29, .16, '#d9ddc6', { glow: 1 });
                lamp(3.34, -2.11, 4.84, 2.8, '#ffe5a7');
                lamp(3.48, -2.04, .25, 2.7, '#c5ae72');
                pole(3.64, 2.74, 5.33, '#52687b');
                line([V(3.12, 2.74, 4.55), V(4.13, 2.74, 4.55)], '#81949b', 3);
                line([V(3.12, 2.74, 5.12), V(4.13, 2.74, 5.12)], '#81949b', 3);
                for (let k = 0; k < 3; k++) {
                    let za = 4.82 + k * .27;
                    line([V(3.65, 2.74, za), V(1.45, 2.74, za - .47), V(-1.56, 2.61, za - .74)], '#45576e', 1.35, .80);
                    line([V(3.65, 2.74, za), V(4.18, -2.1, za - .42)], '#43546b', 1.15, .72);

                // Street sign on pole + tiny traffic light.
                rod(V(3.64, 2.74, 3.52), V(2.85, 2.74, 3.52), '#a5bcc3', 2.4);
                box(2.74, 2.67, 3.31, .86, .14, .38, '#4c8393');
                sticker(V(2.79, 2.519, 3.63), V(3.52, 2.519, 3.63), V(2.79, 2.519, 3.39), '雨宿通り', { color: '#f5f5e7', size: 21 });
                pole(4.58, .19, 2.60, '#718597');
                box(4.39, .06, 2.45, .39, .27, .92, '#253347');
                for (let k = 0; k < 3; k++) {
                    const colors = ['#cf5265', '#efb65d', '#6cc5af'];
                    disc(4.57, .048, 2.61 + k * .27, .065, colors[k], .65);
                }
                // Small planters are a soft human touch, without characters.
                for (let p of [[-4.63, -1.83], [.16, 2.76]]) {
                    box(p[0], p[1], .26, .51, .47, .34, '#927e77');
                    for (let i = 0; i < 7; i++) {
                        const xx = p[0] + .07 + i * .058, yy = p[1] + .17 + (i % 3) * .075;
                        rod(V(xx, yy, .61), V(xx + .06, yy, .89 + (i % 3) * .08), '#5b9b85', 2.8);
                    }

                lamp(-1.2, -2.1, 2.43, 4.2, '#ffe0a2');
                lamp(-2.3, -1.68, 1.7, 2.4, '#fee2b4');
                lamp(.8, -2.15, 1.7, 2.3, '#ffe6b0');
                lamp(-3.13, -3.20, 1.8, 1.55, '#f38fa9');
                for (let i = 0; i < 160; i++) {
                    drops.push({ x: between(-5.6, 5.6), y: between(-5.6, 5.6), z: between(.3, 8.0), speed: between(2.2, 4.6), len: between(.095, .35), alpha: between(.18, .60) });
                }
                for (let i = 0; i < 20; i++)ripples.push({ x: between(-4.75, 4.8), y: between(-4.78, 4.7), phase: between(0, 1), speed: between(.28, .6) });
            }
            build();
            // Orthographic camera: intentional collectible isometric/anime illustration look.
            function project(p) {

            function poly2D(pts) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let j = 1; j < pts.length; j++)ctx.lineTo(pts[j].x, pts[j].y); ctx.closePath() }

                    ctx.strokeStyle = obj.color; ctx.lineWidth = obj.width; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();

                    ctx.shadowColor = obj.color || '#fff'; ctx.shadowBlur = obj.bold ? 7 : 1;

            function drawSky() {
                let gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#101427'); gr.addColorStop(.50, '#1c2a42'); gr.addColorStop(1, '#334458');
                ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
                const x = W * .48, y = H * .68, r = MIN(W, H) * .87;
                let glow = ctx.createRadialGradient(x, y, 1, x, y, r);
                glow.addColorStop(0, 'rgba(97,113,145,.20)'); glow.addColorStop(.54, 'rgba(70,98,140,.075)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
                // Soft cast shadow visually detaches the whole complete plinth.
                ctx.save(); ctx.translate(W * .5, H * .72); ctx.scale(1, .34);
                let sh = ctx.createRadialGradient(0, 0, 10, 0, 0, MIN(W, H) * .57);
                sh.addColorStop(0, 'rgba(0,4,15,.59)'); sh.addColorStop(1, 'rgba(0,4,15,0)'); ctx.fillStyle = sh;
                ctx.beginPath(); ctx.arc(0, 0, MIN(W, H) * .57, 0, TAU); ctx.fill(); ctx.restore();
            }
            function drawGlow(p, r, color, opacity = .34) {

                a.addColorStop(0, `rgba(${rgb},${opacity})`); a.addColorStop(.26, `rgba(${rgb},${opacity * .34})`); a.addColorStop(1, `rgba(${rgb},0)`);
                ctx.fillStyle = a; ctx.fillRect(s.x - rad, s.y - rad, rad * 2, rad * 2);
            }
            function animatedDoor(time) {
                const pulse = reduced.matches ? 0 : MAX(0, Math.sin((time % 11) / 11 * TAU - 1.0)) ** 7;
                const amount = pulse * .31, yy = -2.505;
                // Sliding door has two panes; open gap appears periodically.
                for (const [a, b] of [[.85, .85 + .36 - amount / 2], [1.18 + amount / 2, 1.56]]) {
                    if (b <= a) continue;
                    const pts = [V(a, yy, .51), V(b, yy, .51), V(b, yy, 2.55), V(a, yy, 2.55)].map(project);
                    ctx.save(); poly2D(pts); ctx.fillStyle = 'rgba(148,216,224,.075)'; ctx.fill(); ctx.strokeStyle = 'rgba(165,230,231,.68)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
                    let cx = (a + b) / 2; let p0 = project(V(cx, yy - .015, 1.19)), p1 = project(V(cx, yy - .015, 1.49));
                    ctx.strokeStyle = '#d4eae3'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
                }
            }
            function drawPuddles(time) {
                for (const q of ripples) {
                    if (q.x < 2.37 && q.y > -2.68) continue;
                    const tt = reduced.matches ? q.phase : (q.phase + time * q.speed) % 1;
                    const radius = .03 + tt * .42, alpha = (1 - tt) * .34;
                    let arr = []; for (let j = 0; j <= 23; j++) { let a = j * TAU / 23; arr.push(project(V(q.x + Math.cos(a) * radius, q.y + Math.sin(a) * radius, .223))) }
                    ctx.beginPath(); ctx.moveTo(arr[0].x, arr[0].y); for (let j = 1; j < arr.length; j++)ctx.lineTo(arr[j].x, arr[j].y);
                    ctx.strokeStyle = `rgba(179,225,236,${alpha})`; ctx.lineWidth = .8; ctx.stroke();
                }
            }
            function drawRain(time) {
                ctx.save(); ctx.lineCap = 'round';
                const rate = reduced.matches ? 0 : time;
                for (const d of drops) {
                    let z = (d.z - rate * d.speed - .18); z = .25 + ((z - .25) % 7.8 + 7.8) % 7.8;
                    let a = project(V(d.x, d.y, z)); let b = project(V(d.x - .025, d.y + .025, z - d.len));
                    if (a.x < -30 || a.x > W + 30 || a.y < -50 || a.y > H + 50) continue;
                    ctx.strokeStyle = `rgba(185,219,238,${d.alpha * (z > 4 ? .65 : 1)})`;
                    ctx.lineWidth = z > 4 ? .65 : .85; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                }
                // Rainwater trickles down the shopfront glass; local to facade.
                for (let i = 0; i < 23; i++) {
                    const x = -3.75 + (i * 1.618 % 5.25), z = .65 + ((i * .497 - rate * .29) % 1.75 + 1.75) % 1.75;
                    if (x > .77 && x < 1.6) continue;
                    const a = project(V(x, -2.494, z)), b = project(V(x + .012, -2.495, z - .11 - .06 * (i % 3)));
                    ctx.strokeStyle = 'rgba(221,249,251,.23)'; ctx.lineWidth = .85; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                }
                // Thin drops hanging off the eaves.
                for (let i = 0; i < 18; i++) {
                    const xx = -3.89 + i * .326, dr = (i * .467 - rate * .75) % 1;
                    const z = 2.65 - ((dr + 1) % 1) * .31;
                    const a = project(V(xx, -2.70, z)), b = project(V(xx, -2.70, z - .11));
                    ctx.strokeStyle = 'rgba(198,234,245,.33)'; ctx.lineWidth = .95;
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                }
                ctx.restore();
            }
            function drawDynamicLights(time) {
                for (const l of lights) { drawGlow(l.p, l.r, l.color, l.r > 3 ? .16 : .23) }
                // Shop sign breathes slightly, never harsh strobe.
                const s = project(V(-.8, -2.71, 3.02));
                drawGlow(V(-.8, -2.71, 3.02), 2.10, '#ffe5a7', .050 + (reduced.matches ? 0 : (1 + Math.sin(time * 3.9)) * .016));
                // The tiny distant traffic signal changes gently.
                const colors = ['#85ebc0', '#f1b772', '#d46f7d'];
                const k = reduced.matches ? 0 : Math.floor(time / 6) % 3;
                const ss = project(V(4.57, .015, 2.61 + (2 - k) * .27));
                const r = 6 * cameraScale() / 35 + 2;
                const g = ctx.createRadialGradient(ss.x, ss.y, 0, ss.x, ss.y, r * 4);
                g.addColorStop(0, colors[k]); g.addColorStop(1, 'rgba(140,205,188,0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ss.x, ss.y, r * 4, 0, TAU); ctx.fill();
            }
            function paint(now) {
                const dt = previous ? MIN((now - previous) / 1000, .05) : 0; previous = now;
                if (!reduced.matches) t += dt;
                frame++; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
                drawSky();
                const ordered = faces.map(f => {
                    const pts = f.pts.map(project); let depth = 0; for (const p of pts) depth += p.depth;
                    return { f, pts, depth: depth / pts.length + (f.depthBias || 0) };
                });
                ordered.sort((a, b) => (a.f.layer ?? 0) - (b.f.layer ?? 0) || a.depth - b.depth);
                for (const o of ordered) drawObject(o.f, o.pts);
                animatedDoor(t);
                drawPuddles(t);
                drawDynamicLights(t);
                drawRain(t);
                // A very delicate cinematic vignette; no buttons, legends, or HUD.
                const vig = ctx.createRadialGradient(W * .5, H * .44, MIN(W, H) * .1, W * .5, H * .50, MAX(W, H) * .79);
                vig.addColorStop(0, 'rgba(5,8,21,0)'); vig.addColorStop(1, 'rgba(3,7,19,.40)');

            // Mouse + touch: one finger orbit, two fingers pinch and translate; right/Shift drag pan.
            const active = new Map(); let lastCenter = null, lastDist = 0, dragMode = 'rotate';
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            function pointerCenter() { const a = [...active.values()]; let x = 0, y = 0; for (const p of a) { x += p.x; y += p.y } return { x: x / a.length, y: y / a.length } }
            function pointerSpan() { const a = [...active.values()]; return a.length >= 2 ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0 }
            canvas.addEventListener('pointerdown', e => {
                e.preventDefault(); canvas.focus({ preventScroll: true });
                canvas.setPointerCapture(e.pointerId); active.set(e.pointerId, { x: e.clientX, y: e.clientY });

            });
            canvas.addEventListener('pointermove', e => {
                if (!active.has(e.pointerId)) return;

                    cam.panY -= dx * sn / s + dy * cs / (s * MAX(.35, Math.sin(cam.pitch))) * .35;

            window.addEventListener('keydown', e => {
                let used = true;
                switch (e.key) {
                    case 'ArrowLeft': cam.yaw -= .11; break; case 'ArrowRight': cam.yaw += .11; break;
                    case 'ArrowUp': cam.pitch = clamp(cam.pitch - .085, .18, 1.28); break;
                    case 'ArrowDown': cam.pitch = clamp(cam.pitch + .085, .18, 1.28); break;
                    case '+': case '=': cam.zoom = clamp(cam.zoom * 1.12, .48, 2.95); break;
                    case '-': case '_': cam.zoom = clamp(cam.zoom / 1.12, .48, 2.95); break;
                    case 'a': case 'A': cam.panX -= .22; break; case 'd': case 'D': cam.panX += .22; break;
                    case 'w': case 'W': cam.panY += .22; break; case 's': case 'S': cam.panY -= .22; break;
                    case 'Home': Object.assign(cam, home); break;
                    default: used = false;
                }
                if (used) e.preventDefault();
            });
            window.addEventListener('resize', resize, { passive: true });
            resize(); requestAnimationFrame(paint);
        })();
