        }

        canvas {
            display: block;
            width: 500px;
            height: 400px;
        }

        .model-layer {
            position: fixed; /* 固定层，便于拖拽和旋转 */
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(30, 40, 60, 0.7);
            border-radius: 12px;
            box-shadow: 2px 2px 10px #000;
        }

        h1 {
            font-size: 20px;
            margin: 5px 0 0;
            text-align: center;
        }

        p {
            max-width: 600px;
            text-align: left;
            color: #a6d8ff; /* 柔和的夜景色 */
        }

        .core-objects-container {
            margin-top: 15px;
        }

        .object-list {
            list-style: none;
            padding: 0;
        }

        .object-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .object-btn {
            background: #fff;
            color: #4a9dbf;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .object-btn:hover {
            opacity: 0.7;
        }

        .instruction {
            margin-top: 10px;
            font-size: 14px;
            color: #a6d8ff;
        }

        .physics-notes {
            position: absolute;
            top: 50%;
            left: 20px;
            color: #a6d8ff;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>

            <ul class="object-list" id="objectsList"></ul>
            <div class="instruction">内部有：货架、柜子、收银台、冰柜、杂志、宣传海报、灯箱、便当、饮料、零食等；与雨夜街景鲜明对比。</div>
        </div>
    </div>

    const canvas = document.getElementById('sceneCanvas');

    function resize() {
        let width = canvas.width;
        let height = canvas.height;
        if (width < 60) width = 60;
        if (height < 400) height = 400;
        scene.style.minWidth = width + 'px';
        scene.style.minHeight = height + 'px';
        canvas.style.height = Math.max(height, scene.offsetHeight) + 'px';
    }

    function resizeBottom(px) {
        if (!Number.isFinite(px)) return;
        currentSize = Math.max(5, px);
        resize();
    }

    function drawScene() {
        // 绘制底层正方形底座（可拖拽缩放）
        const rect = canvas.getBoundingClientRect();
        const bottom = rect.bottom + window.scrollY;
        const topLeft = { x: -bottom, y: bottom };
        const bottomRight = { x: width - bottom, y: bottom };

        // 绘制底层：正方形（边长 currentSize，居中）
        function drawRect(px, y) {
            const rectStyle = {
                left: px + (width / 2),
                top: y,
                width: Math.min(currentSize * 2, 200), // 约 100-200
                height: Math.min(currentSize * 2, 180)  // 约 100-180
            };
            const canvasRect = canvas.getBoundingClientRect();
            const rectStyleObj = {
                left: (canvas.width / 2) - rect.x,
                top: y - 20,
                width: rect.width - (canvas.width/2),
                height: rect.height
            };
            context.beginPath(); context.restore();
            context.fillRect(rectLeft, y + rectStyleObj.top);
        }

        drawRect(topLeft, bottom);
        drawRect(bottomRight, top);

        // 绘制底层：可拖拽缩放的矩形（底座）
        const bottomRect = document.createElement('rect');
        bottomRect.style.width = `${currentSize}px`;
        bottomRect.style.height = `${currentSize * 1.5}px`; // 约 150-200
        bottomRect.style.left = -bottom + 'px';
        bottomRect.style.top = bottom + 'px';
        objectsList.appendChild(bottomRect);
        resize();

    }

    function toggleRotation() {
        const rects = document.querySelectorAll('rect');
        rects.forEach(el => el.style.transform = 'scale(1)');
    }

    function toggleScale() {
        if (objectsList.children.length > 0) {
            resize();
        } else {
            resizeBottom(currentSize - 5); // 缩小底座
        }
    }

    function addObject(obj) {
        const div = document.createElement('div');
        div.className = 'object';
        div.textContent = obj;
        objectsList.appendChild(div);
        toggleRotation();
        resize(); // 重新调整比例以适应对象
    }

    function removeObject(evt) {
        evt.stopImmediatePropagation();
        const el = evt.currentTarget;
        if (el === addObject.call(this)) {
            toggleRotation();
            resizeBottom(currentSize - 5);
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            e.preventDefault();
            resizeBottom(currentSize + (e.key === 'ArrowUp' ? 5 : -5));
            toggleRotation();
        }

            resize();
            toggleScale();
        }

            resizeBottom(currentSize - 5); // 缩小底座
            toggleRotation();
        }
    });

    function handleDrag(e) {
        const rect = canvas.getBoundingClientRect();
        e.preventDefault(); // 避免拖动底层
        resizeBottom(rect.width + window.innerHeight / 2); // 居中底座
        toggleRotation();
        toggleScale();
    }

    function handleTouch(e) {
        let touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        if (touch.clientX < rect.left || touch.clientY < rect.top) return;
        resizeBottom(touch.clientX - rect.left + window.innerHeight / 2);
        toggleRotation();
    }

    function handleKeyboard(e) {
        let key;
        if (e.ctrlKey || e.metaKey) {
            key = '↑';
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'w' || e.key === '↑') {
            return; // 已由上面的键盘监听器处理
        } else if (e.key === 'ArrowLeft' || e.key === '←') key = '←';
        else if (e.key === 'ArrowRight' || e.key === '→') key = '→';
        if (!key) return;
        e.preventDefault();
        resizeBottom(currentSize + (key === '→' ? 5 : -5)); // 拖拽底座，缩放与旋转
    }
