  DOOR.range[1] = vcount;

}

var GOODS = [C.g1, C.g2, C.g3, C.g4, C.g5, C.g6, C.g7, C.g8, C.g9, C.g10, C.g11, C.g12];
function fillGoods(a0, a1, y, b0, b1, seed, hBase, axis) {
  var r = rng((seed * 977 + 13) >>> 0);
  var a = a0, guard = 0;
  while (a < a1 - 0.07 && guard++ < 200) {
    var w = 0.075 + r() * 0.1;
    if (a + w > a1) w = a1 - a;
    if (w < 0.03) break;
    var h = hBase * (0.62 + r() * 0.5);
    var c = GOODS[Math.floor(r() * 12)];
    if (axis === "x") {
      box(null, a, a + w, y, y + h, b0, b1, c, MAT.STD, [0.13, 0.12, 0.1]);
      if (r() > 0.55) box(null, a, a + w, y + h, y + h + 0.03, b0, b1, C.white, MAT.STD, [0.26, 0.26, 0.24]);
    } else {
      box(null, b0, b1, y, y + h, a, a + w, c, MAT.STD, [0.13, 0.12, 0.1]);
    }
    a += w + 0.014;
  }
}

void main(){
  if (vMat == 5) {

  vec3 V = normalize(uCam - vP);

  if (vMat == 6) {
    vec4 t = texture(uTex, vUV);
    float fl = (abs(vP.x - 9.9) < 1.0 && vP.y > 6.0) ? uFlicker : 1.0;

  if (vMat == 8) { /* coffee machine panel: emissive-ish texture */
    vec4 t = texture(uTex, vUV);
    oCol = vec4(t.rgb * (0.55 + vE.r * 0.9), 1.0);
    return;
  }
  if (vMat == 9) { /* magazine covers strip */
    vec4 t = texture(uTex, vec2(fract(vUV.x * 1.0), 0.62 + vUV.y * 0.16));
    oCol = vec4(t.rgb * (0.5 + 0.5 * vE.r + 0.1), 1.0);
    return;
  }
  /* ---- lit / emissive solids ---- */
  if (vMat == 7) {
    float fl = 1.0;
    if (abs(vP.x - 9.9) < 1.0 && vP.y > 6.0) fl = uFlicker;
    vec3 e = vE * vG;
    vec3 c = vC * (0.55 + e * 0.9) + e * 0.35;
    oCol = vec4(c * fl, 1.0);
    return;
  }
  /* ---- glass ---- */
  if (vMat == 3) {
    vec3 R = reflect(-V, N);
    vec3 env = envColor(R);
    float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.0);
    float colId = floor(vUV.x * 24.0);
    float rnd = hash12(vec2(colId, 1.3));
    float trav = fract(rnd + uTime * (0.028 + rnd * 0.05));
    float dy = vUV.y - trav;
    float drop = smoothstep(0.0, 0.035, dy) * (1.0 - smoothstep(0.035, 0.2, dy));
    float beads = smoothstep(0.83, 1.0, hash12(floor(vUV * vec2(46.0, 30.0))));
    beads *= 0.6 + 0.4 * sin(uTime * 1.6 + vUV.x * 31.0);

  }

  float up = clamp(N.y, 0.0, 1.0);
  vec3 light = mix(vec3(0.075,0.09,0.15), vec3(0.14,0.135,0.225), up * 0.5 + 0.5) * 1.02;

  lc[0]=uLc0; lc[1]=uLc1; lc[2]=uLc2; lc[3]=uLc3;

  if (vP.x > -6.2 && vP.x < 8.2 && vP.z > -8.8 && vP.z < 3.8 && vP.y > 0.4) {
    light += vec3(1.0,0.85,0.64) * 0.6 * mix(0.8, 1.0, uFlicker);

    vec2 uv = vP.xz;
    vec2 q = vec2(uv.x * 0.05, uv.y * 0.148);
    float wob = 0.055 * sin(uv.y * 0.8 + uTime * 0.55) + 0.03 * sin(uv.x * 1.9 - uTime * 0.35);
    wob += 0.008 * sin(uv.x * 7.0 + uv.y * 5.0);
    vec3 refl = streetRefl(q, wob);
    float pud = puddleMask(uv);
    float spill = smoothstep(9.5, 4.0, uv.y) * smoothstep(-9.0, -1.0, uv.y) * smoothstep(-9.0, -4.0, uv.x) * smoothstep(15.0, 6.0, uv.x);
    refl += vec3(1.0,0.74,0.44) * spill * 0.42;
    refl += vec3(0.9,0.7,0.4) * smoothstep(6.0, 7.2, uv.y) * smoothstep(-2.0, 3.0, uv.x) * smoothstep(6.0, 3.0, uv.x) * 0.25;

    float lampGlow = 0.0;
    lampGlow += exp(-length(uv - vec2(11.0, 8.4)) * 0.55);
    lampGlow += exp(-length(uv - vec2(-7.3, 8.4)) * 0.55);
    lampGlow += exp(-length(uv - vec2(9.3, 8.4)) * 1.2) * 0.5;
    refl += vec3(1.0,0.86,0.62) * lampGlow * 0.35;

    surf = mix(surf, surf * 0.36 + refl * (0.9 + pud * 1.1), clamp(wet * (0.42 + fres), 0.0, 0.94));
    surf += vec3(0.55,0.66,0.85) * spec * (0.45 + pud * 0.7);
    if (pud > 0.02) {
      float rip = 0.0;
      for (int k = 0; k < 4; k++){
        float fk = float(k);
        vec2 cc = vec2(hash12(vec2(fk, 2.3)), hash12(vec2(fk, 7.1))) * 2.0 - 1.0;
        cc = uv * 0.38 + cc * 1.2;
        float ph = fract(uTime * 0.62 + fk * 0.29);
        float d = length(uv - cc * 2.6);
        float ring = abs(fract(d * 0.55 + ph) - 0.5);
        rip += smoothstep(0.06, 0.0, abs(ring - 0.44)) * (1.0 - ph);
      }
      surf += vec3(0.42,0.52,0.68) * rip * pud * 0.26;
    }
  } else {
    surf += spec * 0.22 * (1.0 - up);
  }

  // fog to blend the diorama edges into the night
  float dist = length(uCam - vP);
  surf = mix(surf, uFogCol, 1.0 - exp(-dist * dist * uFogDen));
  oCol = vec4(surf, 1.0);
}`;

function compile(type, src) {

  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(p));

  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16);
  gl.bindVertexArray(null);
}
function resetDrop(i, init) {
  var o = i * 8;
  var x, z;
  do {
    x = Math.random() * 47 - 23.5;
    z = Math.random() * 47 - 23.5;
  } while (x > -6.5 && x < 8.5 && z > -9.0 && z < 4.1);
  rainData[o] = x;
  rainData[o + 1] = init ? Math.random() * 22 - 2 : 15 + Math.random() * 10;
  rainData[o + 2] = z;
  rainData[o + 3] = 1.0;
  rainData[o + 4] = 0.42 + Math.random() * 0.25;
  rainData[o + 5] = -15 - Math.random() * 7;
  rainData[o + 6] = 0.18 + Math.random() * 0.12;
  rainData[o + 7] = Math.random();
}
function updateRain(dt) {
  var R = rainData;
  for (var i = 0; i < RAIN_N; i++) {
    var o = i * 8;
    R[o] += R[o + 4] * dt;
    R[o + 1] += R[o + 5] * dt;
    R[o + 2] += R[o + 6] * dt;
    var x = R[o], z = R[o + 2];
    var floorY = -0.2;
    if (x > -9.5 && x < 20.1 && z > 8.6) floorY = 0.35;
    else if (x > -9.5 && x < -9.0) floorY = 0.35;

}

function makeTargets(w, h) {
  if (fbo) { gl.deleteFramebuffer(fbo); gl.deleteTexture(texColor); gl.deleteTexture(texDepth); }
  texColor = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texColor);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  texDepth = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texDepth);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, w, h, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texColor, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, texDepth, 0);
  var st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (st !== gl.FRAMEBUFFER_COMPLETE) console.warn("framebuffer incomplete 0x" + st.toString(16));

}
function resize(force) {
  var dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  var w = Math.max(64, Math.round(canvas.clientWidth * dpr));
  var h = Math.max(64, Math.round(canvas.clientHeight * dpr));
  var cap = 1700;
  if (w > cap) { h = Math.round(h * cap / w); w = cap; }
  if (h > cap * 1.4) { w = Math.round(w * cap * 1.4 / h); h = Math.round(cap * 1.4); }

    canvas.width = w; canvas.height = h;
    makeTargets(w, h);
  }
}

/* ==========================================================================
   CAMERA
   ========================================================================== */
var cam = {
  yaw: -0.50, pitch: 0.50, dist: 58,
  tyaw: -0.50, tpitch: 0.50, tdist: 58,
  target: [0.8, 2.0, 1.2], ttarget: [0.8, 2.0, 1.2]
};
var HOME = { yaw: -0.50, pitch: 0.50, tx: 0.8, ty: 2.0, tz: 1.2 };
var MIN_D = 11, MAX_D = 150;
function fitDist() {
  var asp = canvas.clientWidth / Math.max(canvas.clientHeight, 1);
  var d = 56;
  if (asp < 1.2) d = 56 * Math.pow(1.2 / Math.max(asp, 0.42), 0.9);
  return Math.min(120, d);
}
function resetView() {
  cam.tyaw = HOME.yaw; cam.tpitch = HOME.pitch; cam.tdist = fitDist();
  cam.ttarget = [HOME.tx, HOME.ty, HOME.tz];
}
function clampTarget() {
  cam.ttarget[0] = clamp(cam.ttarget[0], -9, 11);
  cam.ttarget[1] = clamp(cam.ttarget[1], 0.6, 7);
  cam.ttarget[2] = clamp(cam.ttarget[2], -9, 11);
}
function panBy(dx, dy) {
  var s = cam.tdist * 0.0015;
  var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.max(Math.cos(cam.pitch), 0.3);
  cam.ttarget[0] -= (cy * dx - sy * dy / cp) * s;
  cam.ttarget[2] += (sy * dx + cy * dy / cp) * s;
  clampTarget();
}
function updateCamera(dt) {
  var k = 1 - Math.exp(-dt * 9.0);
  cam.yaw += (cam.tyaw - cam.yaw) * k;
  cam.pitch += (cam.tpitch - cam.pitch) * k;
  cam.dist += (cam.tdist - cam.dist) * k;
  for (var i = 0; i < 3; i++) cam.target[i] += (cam.ttarget[i] - cam.target[i]) * k;
}
function computeVP() {
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  var e = [cam.target[0] + cam.dist * cp * Math.sin(cam.yaw),
           cam.target[1] + cam.dist * sp,
           cam.target[2] + cam.dist * cp * Math.cos(cam.yaw)];
  camPos = e;
  var asp = fbW / fbH;
  var fov = asp < 1.0 ? 0.84 : 0.66;
  var Pj = mPersp(fov, asp, NEAR, FAR);
  var Vw = mLook(e, cam.target, [0, 1, 0]);
  VP = mMul(Pj, Vw);
}

/* ==========================================================================
   INPUT
   ========================================================================== */
var touches = [], ptr = { down: false, x: 0, y: 0, btn: 0 };
var lastPinch = 0, lastMid = [0, 0];
canvas.addEventListener("pointerdown", function (e) {
  try { canvas.focus({ preventScroll: true }); } catch (_) {}
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType === "touch") {
    touches.push({ id: e.pointerId, x: e.clientX, y: e.clientY });
    if (touches.length === 1) lastMid = [e.clientX, e.clientY];
    if (touches.length === 2) {
      lastPinch = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
      lastMid = [(touches[0].x + touches[1].x) / 2, (touches[0].y + touches[1].y) / 2];
    }
    e.preventDefault();
    return;
  }
  ptr.down = true; ptr.x = e.clientX; ptr.y = e.clientY; ptr.btn = e.button;
  canvas.classList.add("dragging");
  e.preventDefault();
});
canvas.addEventListener("pointermove", function (e) {
  if (e.pointerType === "touch") {
    for (var i = 0; i < touches.length; i++) if (touches[i].id === e.pointerId) { touches[i].x = e.clientX; touches[i].y = e.clientY; }
    if (touches.length === 1) {
      var dx = e.clientX - lastMid[0], dy = e.clientY - lastMid[1];
      lastMid = [e.clientX, e.clientY];
      cam.tyaw -= dx * 0.0085;
      cam.tpitch = clamp(cam.tpitch + dy * 0.0055, 0.10, 1.40);
    } else if (touches.length >= 2) {
      var d = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
      var mid = [(touches[0].x + touches[1].x) / 2, (touches[0].y + touches[1].y) / 2];
      if (lastPinch > 0) cam.tdist = clamp(cam.tdist * lastPinch / Math.max(d, 1), MIN_D, MAX_D);
      lastPinch = d;
      panBy(mid[0] - lastMid[0], mid[1] - lastMid[1]);
      lastMid = mid;
    }
    return;
  }
  if (!ptr.down) return;
  var mx = e.clientX - ptr.x, my = e.clientY - ptr.y;
  ptr.x = e.clientX; ptr.y = e.clientY;
  if (ptr.btn === 2 || e.shiftKey || e.ctrlKey || e.metaKey) panBy(mx, my);
  else {
    cam.tyaw -= mx * 0.0072;
    cam.tpitch = clamp(cam.tpitch + my * 0.0048, 0.10, 1.40);
  }
});
function releasePtr(e) {
  if (e.pointerType === "touch") {
    touches = touches.filter(function (t) { return t.id !== e.pointerId; });
    if (touches.length < 2) lastPinch = 0;
    return;
  }

}
canvas.addEventListener("pointerup", releasePtr);
canvas.addEventListener("pointercancel", releasePtr);
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  var dy = e.deltaY * (e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 400 : 1));
  cam.tdist = clamp(cam.tdist * Math.exp(dy * 0.00105), MIN_D, MAX_D);
}, { passive: false });
canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
canvas.addEventListener("dblclick", function (e) { e.preventDefault(); resetView(); });
canvas.addEventListener("keydown", function (e) {
  var k = e.key, used = true, step = e.shiftKey ? 0.10 : 0.05;
  switch (k) {
    case "ArrowLeft": cam.tyaw += step; break;
    case "ArrowRight": cam.tyaw -= step; break;
    case "ArrowUp":
      if (e.shiftKey) { cam.ttarget[1] = clamp(cam.ttarget[1] + 0.3, 0.6, 7); }
      else cam.tpitch = clamp(cam.tpitch + step, 0.10, 1.40);
      break;
    case "ArrowDown":
      if (e.shiftKey) { cam.ttarget[1] = clamp(cam.ttarget[1] - 0.3, 0.6, 7); }
      else cam.tpitch = clamp(cam.tpitch - step, 0.10, 1.40);
      break;
    case "PageUp": cam.tdist = clamp(cam.tdist * 0.88, MIN_D, MAX_D); break;
    case "PageDown": cam.tdist = clamp(cam.tdist * 1.14, MIN_D, MAX_D); break;
    case "+": case "=": case "Add": cam.tdist = clamp(cam.tdist * 0.9, MIN_D, MAX_D); break;
    case "-": case "_": case "Subtract": cam.tdist = clamp(cam.tdist * 1.1, MIN_D, MAX_D); break;
    case "r": case "R": resetView(); break;
    case "m": case "M": animON = !animON; break;
    case "p": case "P": doCapture(); break;
    default: used = false;
  }
  if (used) e.preventDefault();
});
window.addEventListener("keydown", function (e) {
  if (document.activeElement === canvas) return;
  if (e.key === "r" || e.key === "R") resetView();
});

/* capture the current frame as a downloadable PNG (sandbox may block it) */
function doCapture() {
  try {
    renderFrame(0, true);
    var url = canvas.toDataURL("image/png");
    var a = document.createElement("a");
    a.href = url; a.download = "yoru-konbini-diorama.png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (err) { console.warn("capture unavailable", err); }
}

/* ==========================================================================
   ANIMATION STATE
   ========================================================================== */
var flick = 1.0, flickT = 0;
var door = { amount: 0, phase: -1, next: 5.0 };
var sig = { green: 1, red: 1, amber: 0 };
var dynLights = [0, 0, 0, 0];
var doorDirty = false;
var lastNow = 0, fpsAcc = 0, fpsN = 0;

function updateAnim(dt) {
  // sign tube flicker: mostly steady, with brief stutters
  flickT += dt;
  var f = Math.sin(flickT * 13.0) + Math.sin(flickT * 37.3 + 1.1) + Math.sin(flickT * 71.7 + 2.3);
  var dip = (f > 2.55) ? 0.62 : 1.0;
  if (Math.sin(flickT * 0.41) > 0.985) dip *= 0.55;
  flick += (dip - flick) * Math.min(1, dt * 22);
  // automatic door
  if (animON) {
    if (door.phase < 0) {
      if (T > door.next) { door.phase = 0; }
    } else {
      door.phase += dt;
      var ph = door.phase, target = 0;
      if (ph < 1.3) target = ph / 1.3;
      else if (ph < 3.4) target = 1;
      else if (ph < 5.0) target = 1 - (ph - 3.4) / 1.6;
      else { target = 0; door.phase = -1; door.next = T + 8 + Math.random() * 10; }
      door.amount = target;
    }
    if (door.amount > 0.0005) doorDirty = true;
  }
}
/* shift the sliding-door leaf vertices in the shared vertex buffer */
function applyDoor() {
  if (!doorDirty || !DOOR.orig) return;
  doorDirty = false;
  var a = DOOR.range[0], b = DOOR.range[1], half = (a + b) >> 1;
  var n = b - a;
  var buf = new Float32Array(n * STR);
  for (var i = 0; i < n; i++) {
    var vi = a + i;
    var shift = (vi < half) ? (door.amount * 1.42) : (-door.amount * 1.42);
    var src = i * STR, s3 = i * 3;
    buf[src] = DOOR.orig[s3] + shift;
    buf[src+1] = DOOR.orig[s3+1];
    buf[src+2] = DOOR.orig[s3+2];
    buf[src+3] = DOOR.orig[s3];     // normal x kept; door geometry stays axis aligned
    buf[src+4] = DOOR.orig[s3+1];
    buf[src+5] = DOOR.orig[s3+2];
    // copy the remaining attribute floats straight from the static buffer
    for (var f = 3; f < STR; f++) buf[src + f] = staticPos[src + f];
    buf[src+3] = staticPos[src+3]; buf[src+4] = staticPos[src+4]; buf[src+5] = staticPos[src+5];
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, a * STR * 4, buf);
}

/* four analytic lights follow the most meaningful sources */
function pickLights() {
  return [
    [4.6, 2.6, 1.0, 15.0],     // storefront pylon lamp (flickers)
    [10.4, 6.4, 8.3, 17.0],    // street lamp right
    [-7.3, 6.4, 8.3, 15.0],    // street lamp left
    [3.2, 1.9, 7.0, 8.0]       // vending machines
  ];
}

/* ==========================================================================
   RENDER
   ========================================================================== */
var outData = new Float32Array(48);
function renderFrame(dt, isCapture) {
  computeVP();
  var lights = pickLights();
  if (doorDirty) applyDoor();

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, fbW, fbH);
  gl.clearColor(0.015, 0.02, 0.04, 1);
  gl.clearDepth(1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);

  /* opaque */
  gl.useProgram(P.main);
  gl.uniformMatrix4fv(U.main.uVP, false, VP);
  gl.uniform3fv(U.main.uCam, camPos);
  gl.uniform1f(U.main.uTime, RT);
  gl.uniform1f(U.main.uFlicker, flick);
  gl.uniform3f(U.main.uFogCol, 0.028, 0.038, 0.068);
  gl.uniform1f(U.main.uFogDen, 0.000026);
  gl.uniform1f(U.main.uToon, toonOn ? 1 : 0);
  gl.uniform4fv(U.main.uPud, PUD_GEO);
  gl.uniform4f(U.main.uSig, sig.green, sig.red, 1, 0);
  var lc = [
    [1.0, 0.94, 0.8],
    [1.0, 0.82, 0.58],
    [1.0, 0.82, 0.58],
    [0.55, 0.74, 1.0]
  ];
  for (var i = 0; i < 4; i++) {
    gl.uniform4f(U.main["uL" + i], lights[i][0], lights[i][1], lights[i][2], lights[i][3]);
    gl.uniform3f(U.main["uLc" + i], lc[i][0], lc[i][1], lc[i][2]);
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texSign);
  gl.uniform1i(U.main.uTex, 0);
  gl.bindVertexArray(vao);
  gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);

  /* transparent overlay */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.depthMask(false);
  gl.useProgram(P.out);
  gl.uniformMatrix4fv(U.out.uVP, false, VP);
  gl.uniform1f(U.out.uTime, RT);
  gl.bindVertexArray(outVAO);
  gl.drawElements(gl.TRIANGLES, outIndexCount, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);

  /* rain: 4 vertices per drop through gl_VertexID, one instance per drop */
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(P.rain);
  gl.uniformMatrix4fv(U.rain.uVP, false, VP);
  gl.uniform2f(U.rain.uRes, fbW, fbH);
  gl.bindVertexArray(rainVAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, RAIN_N);
  gl.bindVertexArray(null);
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  /* post to the canvas */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(P.post);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texColor); gl.uniform1i(P0, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texDepth); gl.uniform1i(P1, 1);
  gl.uniform2f(Q.res, fbW, fbH);
  gl.uniform1f(Q.near, NEAR);
  gl.uniform1f(Q.far, FAR);
  gl.uniform1f(Q.toon, toonOn ? 1 : 0);
  gl.uniform1f(Q.line, 1.0);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
}
var P0 = null, P1 = null, Q = {};

/* ==========================================================================
   BOOT
   ========================================================================== */
function initGL() {
  var atlasCanvas = mkCanvas(1024, 1024);
  drawSignAtlas(atlasCanvas);
  texSign = uploadTexture(atlasCanvas, false);

  buildScene();
  uploadStaticMesh();
  uploadOverlay();
  initRain();

  P.main = program(VS_MAIN, FS_MAIN);
  P.out = program(VS_OUT, FS_OUT);
  P.rain = program(VS_RAIN, FS_RAIN);
  P.post = program(VS_QUAD, FS_POST);
  U.main = uloc(P.main, ["uVP","uCam","uTime","uTex","uFogCol","uFogDen","uFlicker","uToon","uPud","uSig",
    "uL0","uLc0","uL1","uLc1","uL2","uLc2","uL3","uLc3"]);
  U.out = uloc(P.out, ["uVP","uTime"]);
  U.rain = uloc(P.rain, ["uVP","uRes"]);
  P0 = gl.getUniformLocation(P.post, "uColor");
  P1 = gl.getUniformLocation(P.post, "uDepth");
  Q.res = gl.getUniformLocation(P.post, "uRes");
  Q.near = gl.getUniformLocation(P.post, "uNear");
  Q.far = gl.getUniformLocation(P.post, "uFar");
  Q.toon = gl.getUniformLocation(P.post, "uToon");
  Q.line = gl.getUniformLocation(P.post, "uLine");

  quadVAO = gl.createVertexArray();
  resize(true);
}

function frame(now) {
  if (!lastNow) lastNow = now;
  var dtRaw = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  var dt = dtRaw * (animON ? timeScale : 0.25);
  T += dt; RT += animON ? dt : dt * 0.6;
  updateAnim(dtRaw);
  updateRain(animON ? dtRaw * timeScale : dtRaw * 0.12);
  updateCamera(dtRaw);
  if (animON) applyDoor();
  renderFrame(dtRaw, false);
  requestAnimationFrame(frame);
}

try {
  initGL();
} catch (err) {
  console.error(err);
  fail("三维场景初始化失败，请使用较新的浏览器重试。");
  return;
}

window.addEventListener("resize", function () { resize(false); });
if (window.ResizeObserver) {
  try { new ResizeObserver(function () { resize(false); }).observe(canvas); } catch (_) {}
}
if (mqReduce && mqReduce.addEventListener) {
  try {
    mqReduce.addEventListener("change", function (e) {
      reduced = e.matches;
      animON = !reduced;
      if (!animON) { door.amount = 0; door.phase = -1; doorDirty = true; applyDoor(); }
    });
  } catch (_) {}
}
resetView();
cam.dist = cam.tdist; cam.pitch = cam.tpitch; cam.yaw = cam.tyaw;
cam.target = cam.ttarget.slice();
requestAnimationFrame(frame);
/* @@PART3END@@ */
})();
</script>
